<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>animator</title>
    <link rel="stylesheet" href="../portal.css?v=4" />
  </head>
  <body data-portal-root="../" data-default-version="v2">
    <aside class="assets-directory" aria-label="Versions">
      <h1>animator</h1>

      <div class="assets-section">
        <div class="assets-section-title-row">
          <h2 class="assets-title">version 1</h2>
          <button
            id="v1Toggle"
            type="button"
            class="assets-section-toggle"
            aria-expanded="false"
            aria-controls="v1List"
            aria-label="expand version 1"
          >
            +
          </button>
        </div>
        <ul class="saved-billboards-list" id="v1List" hidden></ul>
      </div>

      <div class="assets-section">
        <div class="assets-section-title-row">
          <h2 class="assets-title">version 2</h2>
          <button
            id="v2Toggle"
            type="button"
            class="assets-section-toggle"
            aria-expanded="false"
            aria-controls="v2List"
            aria-label="expand version 2"
          >
            +
          </button>
        </div>
        <ul class="saved-billboards-list" id="v2List" hidden></ul>
      </div>

      <div class="sidebar-footer">
        <a id="editorLink" href="../index.html">open editor →</a>
      </div>
    </aside>

    <main class="viewer" id="viewer">
      <span id="viewerHint">choose an animation →</span>
      <iframe
        id="frame"
        title="Animation"
        src="about:blank"
        allow="autoplay; clipboard-write"
      ></iframe>
    </main>
    <script src="../portal.js?v=16"></script>
  </body>
</html>
