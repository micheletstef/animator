<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>technical outline v1</title>
    <style>
      @font-face {
        font-family: "IkarusPlusVariable";
        src: url("../../fonts/ABCIkarusPlusVariable.ttf") format("truetype-variations");
        font-weight: 100 1000;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: light;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffffff;
        --line: #0078ff;
        --fs: 900;
        --pad-t: 80;
        --pad-r: 80;
        --pad-b: 80;
        --pad-l: 80;
        --lh: 1.3;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d3d3d3;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #1f1f1f;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background: var(--bg);
        overflow: hidden;
        box-shadow: none;
        pointer-events: none;
      }

      .outline-layer {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
        color: var(--line);
        shape-rendering: geometricPrecision;
      }

      .outline-layer .glyph-outline-path {
        stroke: currentColor;
        fill: var(--bg);
        fill-opacity: 1;
        fill-rule: nonzero;
        paint-order: stroke fill;
      }

      .outline-layer .glyph-outline-handle-line {
        stroke: currentColor;
        fill: none;
      }

      .outline-layer .glyph-outline-handle,
      .outline-layer .glyph-outline-node {
        stroke: currentColor;
      }

      .probe {
        position: absolute;
        left: -9999px;
        visibility: hidden;
        font-family: "IkarusPlusVariable", system-ui, sans-serif;
        font-size: calc(var(--fs) * 1px);
        line-height: var(--lh);
        white-space: pre-wrap;
        text-align: center;
      }

      .var-readout {
        position: absolute;
        left: var(--guide-l, calc(var(--pad-l) * 1px));
        right: var(--guide-r, calc(var(--pad-r) * 1px));
        top: auto;
        bottom: var(--guide-b, calc(var(--pad-b) * 1px));
        z-index: 3;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        min-height: 0;
        padding: 0;
        font-size: 22px;
        line-height: 1;
        color: var(--caption, var(--fg));
        background: transparent;
        pointer-events: none;
      }

      .var-readout-item {
        display: flex;
        flex: 0 0 auto;
        align-items: baseline;
        justify-content: flex-start;
        gap: 8px;
        white-space: nowrap;
      }

      .var-readout-item:last-child {
        justify-content: flex-end;
      }

      .var-readout-label {
        opacity: 1;
        letter-spacing: 0;
      }

      .var-readout-value {
        display: inline-block;
        font-variant-numeric: tabular-nums;
        text-align: left;
      }

      #readoutWght {
        min-width: 4ch;
      }

      #readoutCntr,
      #readoutWdth {
        min-width: 3ch;
      }

      #readoutSlnt {
        min-width: 2ch;
      }

      .var-readout-item:last-child .var-readout-value {
        text-align: right;
      }

      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }

      .panel .hint {
        margin: 0 0 14px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .panel .group {
        margin-bottom: 18px;
      }

      .panel .group-title {
        text-transform: lowercase;
        color: #6a6a6a;
        margin: 0 0 8px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="text"],
      .row textarea,
      .row select {
        grid-column: 2 / 4;
        width: 100%;
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #111;
        color: #1f1f1f;
        font: inherit;
      }

      .row select {
        cursor: pointer;
      }

      .row textarea {
        min-height: 72px;
        resize: vertical;
        line-height: 1.2;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .axis-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .axis-row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .dual-range {
        position: relative;
        width: 100%;
        height: 40px;
        min-width: 0;
      }

      .dual-val {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        font-size: 10px;
        line-height: 1.2;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        z-index: 2;
        white-space: nowrap;
      }

      .dual-track {
        position: absolute;
        left: 7px;
        right: 7px;
        top: 24px;
        height: 3px;
        transform: translateY(-50%);
        background: #2a2a2a;
        border-radius: 2px;
        pointer-events: none;
      }

      .dual-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        background: #fff;
        border-radius: 2px;
      }

      .dual-range input[type="range"] {
        position: absolute;
        left: 0;
        right: 0;
        top: 14px;
        width: 100%;
        height: 22px;
        margin: 0;
        background: transparent;
        pointer-events: none;
        -webkit-appearance: none;
        appearance: none;
      }

      .dual-range input[type="range"]:focus {
        outline: none;
      }

      .dual-range input[type="range"]::-webkit-slider-runnable-track,
      .dual-range input[type="range"]::-moz-range-track {
        background: transparent;
        border: 0;
        height: 22px;
      }

      .dual-range input[type="range"]::-webkit-slider-thumb {
        pointer-events: auto;
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        border: 2px solid #1a1a1a;
        box-shadow: 0 0 0 1px #fff;
        margin-top: 0;
      }

      .dual-range input[type="range"]::-moz-range-thumb {
        pointer-events: auto;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        border: 2px solid #1a1a1a;
        box-shadow: 0 0 0 1px #fff;
      }

      .dual-range input.is-end[type="range"]::-webkit-slider-thumb,
      .dual-range input.is-end[type="range"]::-moz-range-thumb {
        background: #1a1a1a;
        border-color: #fff;
        box-shadow: 0 0 0 1px #fff;
      }

      .panel .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .panel button {
        flex: 1;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        padding: 6px 8px;
        font: inherit;
        text-transform: lowercase;
        cursor: pointer;
        border-radius: 4px;
      }

      .panel button:hover {
        border-color: #555;
        color: #fff;
      }

      .panel button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
    </style>

  </head>
  <body data-no-caption>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-outer">
        <div class="stage" id="stage" aria-label="technical outline">
          <svg class="outline-layer" id="outlines" aria-hidden="true"></svg>
          <span class="probe" id="probe">A</span>
          <div class="var-readout" id="varReadout" aria-live="polite">
            <span class="var-readout-item">
              <span class="var-readout-label">Weight</span>
              <span class="var-readout-value" id="readoutWght">500</span>
            </span>
            <span class="var-readout-item">
              <span class="var-readout-label">Contour</span>
              <span class="var-readout-value" id="readoutCntr">0</span>
            </span>
            <span class="var-readout-item">
              <span class="var-readout-label">Width</span>
              <span class="var-readout-value" id="readoutWdth">100</span>
            </span>
            <span class="var-readout-item">
              <span class="var-readout-label">Slant</span>
              <span class="var-readout-value" id="readoutSlnt">0</span>
            </span>
          </div>
        </div>
      </div>
    </div>
    <aside class="panel" aria-label="Settings">
      <h2>settings</h2>
      <p class="hint">scroll to zoom · drag to pan · double-click to fit · 1080 × 1440</p>

      <div class="group">
        <p class="group-title">color</p>
        <div class="row">
          <label for="bg">bg</label>
          <input id="bg" type="color" value="#ffffff" />
          <span class="val" id="bgVal">#ffffff</span>
        </div>
        <div class="row">
          <label for="ln">line</label>
          <input id="ln" type="color" value="#0078ff" />
          <span class="val" id="lnVal">#0078ff</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">outline</p>
        <div class="row">
          <label for="sw">stroke</label>
          <input id="sw" type="range" min="0.25" max="8" step="0.25" value="1.25" />
          <span class="val" id="swVal">1.25</span>
        </div>
        <div class="row">
          <label for="ns">nodes</label>
          <input id="ns" type="range" min="0" max="24" step="0.5" value="9" />
          <span class="val" id="nsVal">9.0</span>

        <div class="row">
          <label for="nsw">node stroke</label>
          <input id="nsw" type="range" min="0" max="8" step="0.25" value="1" />

        </div>
        <div class="row">

          <select id="nf">
            <option value="outline" selected>outline</option>
            <option value="filled">filled</option>
          </select>
        </div>
        <div class="row">
          <label for="hs">handles</label>
          <input id="hs" type="range" min="0" max="24" step="0.5" value="8" />
          <span class="val" id="hsVal">8.0</span>
        </div>
        <div class="row">
          <label for="hsw">handle stroke</label>
          <input id="hsw" type="range" min="0" max="8" step="0.25" value="1" />
          <span class="val" id="hswVal">1.00</span>
        </div>
        <div class="row">
          <label for="hf">handle fill</label>
          <select id="hf">
            <option value="outline" selected>outline</option>
            <option value="filled">filled</option>
          </select>

      </div>

      <div class="group">
        <p class="group-title">type</p>
        <div class="row">
          <label for="ch">text</label>

        <div class="axis-row">
          <label for="fs0">size</label>

            <span class="dual-val" id="fs0Val">900px</span>

            <input id="fs1" class="is-end" type="range" min="200" max="1600" step="1" value="900" aria-label="size end" />

        </div>
        <div class="row">
          <label for="os">scale</label>
          <input id="os" type="range" min="25" max="200" step="1" value="100" />
          <span class="val" id="osVal">1.00×</span>
        </div>
        <div class="row">
          <label for="lh">leading</label>
          <input id="lh" type="range" min="0.5" max="1.6" step="0.01" value="1.3" />

        </div>
        <div class="axis-row">
          <label for="kn0">track</label>
          <div class="dual-range" id="knDual">
            <span class="dual-val" id="kn0Val">0%</span>
            <span class="dual-val" id="kn1Val">0%</span>
            <div class="dual-track"><div class="dual-fill" id="knFill"></div></div>
            <input id="kn0" class="is-start" type="range" min="-100" max="100" step="1" value="0" aria-label="tracking start" />
            <input id="kn1" class="is-end" type="range" min="-100" max="100" step="1" value="0" aria-label="tracking end" />
          </div>
        </div>
        <div class="row">
          <label for="oy">y</label>
          <input id="oy" type="range" min="-720" max="720" step="1" value="0" />
          <span class="val" id="oyVal">0px</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">variables</p>
        <div class="axis-row">
          <label for="wMin">wght</label>
          <div class="dual-range" id="wDual">
            <span class="dual-val" id="wMinVal">200</span>
            <span class="dual-val" id="wMaxVal">1000</span>
            <div class="dual-track"><div class="dual-fill" id="wFill"></div></div>
            <input id="wMin" class="is-start" type="range" min="200" max="1000" step="1" value="200" aria-label="wght start" />
            <input id="wMax" class="is-end" type="range" min="200" max="1000" step="1" value="1000" aria-label="wght end" />
          </div>
        </div>
        <div class="axis-row">
          <label for="cMin">CNTR</label>
          <div class="dual-range" id="cDual">
            <span class="dual-val" id="cMinVal">0.0</span>
            <span class="dual-val" id="cMaxVal">100.0</span>
            <div class="dual-track"><div class="dual-fill" id="cFill"></div></div>
            <input id="cMin" class="is-start" type="range" min="0" max="100" step="0.1" value="0" aria-label="CNTR start" />
            <input id="cMax" class="is-end" type="range" min="0" max="100" step="0.1" value="100" aria-label="CNTR end" />
          </div>
        </div>
        <div class="axis-row">
          <label for="dMin">wdth</label>
          <div class="dual-range" id="dDual">
            <span class="dual-val" id="dMinVal">65</span>
            <span class="dual-val" id="dMaxVal">130</span>
            <div class="dual-track"><div class="dual-fill" id="dFill"></div></div>
            <input id="dMin" class="is-start" type="range" min="65" max="130" step="1" value="65" aria-label="wdth start" />
            <input id="dMax" class="is-end" type="range" min="65" max="130" step="1" value="130" aria-label="wdth end" />
          </div>
        </div>
        <div class="axis-row">
          <label for="sMin">slnt</label>
          <div class="dual-range" id="sDual">
            <span class="dual-val" id="sMinVal">0</span>
            <span class="dual-val" id="sMaxVal">-12</span>
            <div class="dual-track"><div class="dual-fill" id="sFill"></div></div>
            <input id="sMin" class="is-start" type="range" min="-12" max="0" step="0.25" value="0" aria-label="slnt start" />
            <input id="sMax" class="is-end" type="range" min="-12" max="0" step="0.25" value="-12" aria-label="slnt end" />
          </div>
        </div>
      </div>

      <div class="group">
        <p class="group-title">motion</p>
        <div class="row">
          <label for="cy">cycle</label>
          <input id="cy" type="range" min="1500" max="12000" step="100" value="5200" />
          <span class="val" id="cyVal">5.2s</span>
        </div>
        <div class="row">
          <label for="hd">hold</label>
          <input id="hd" type="range" min="0" max="2000" step="50" value="450" />
          <span class="val" id="hdVal">450ms</span>
        </div>
      </div>

    </aside>

    <script>
      (function () {
        var outlineSvg = document.getElementById("outlines");
        var stage = document.getElementById("stage");
        var probe = document.getElementById("probe");
        var FONT_URL = "../../fonts/ABCIkarusPlusVariable.ttf";
        var root = document.documentElement;
        var t0 = 0;
        var raf = 0;
        var playing = true;

        var FS = { min: 200, max: 1600, step: 1, default: 900 };

        var AXES = {
          CNTR: { min: 0, max: 100, step: 0.1, default: 0 },
          wght: { min: 200, max: 1000, step: 1, default: 500 },
          wdth: { min: 65, max: 130, step: 1, default: 100 },
          slnt: { min: -12, max: 0, step: 0.25, default: 0 },
        };

        var DUAL_AXES = [
          { tag: "wght", minKey: "wMin", maxKey: "wMax", fill: "wFill", minVal: "wMinVal", maxVal: "wMaxVal" },
          { tag: "CNTR", minKey: "cMin", maxKey: "cMax", fill: "cFill", minVal: "cMinVal", maxVal: "cMaxVal" },
          { tag: "wdth", minKey: "dMin", maxKey: "dMax", fill: "dFill", minVal: "dMinVal", maxVal: "dMaxVal" },
          { tag: "slnt", minKey: "sMin", maxKey: "sMax", fill: "sFill", minVal: "sMinVal", maxVal: "sMaxVal" },
        ];

        function clampAxis(tag, v) {
          var a = AXES[tag];
          return Math.max(a.min, Math.min(a.max, Number(v)));
        }

        function fmtAxis(tag, v) {
          if (tag === "CNTR") return (Math.round(v * 10) / 10).toFixed(1);
          if (tag === "wght" || tag === "wdth") return Math.round(v).toString();
          return String(v);
        }

        function fmtReadout(tag, v) {
          if (tag === "slnt") return String(Math.abs(Math.round(Number(v))));
          return String(Math.ceil(Number(v)));
        }

        function fvarSettings(v) {
          return (
            '"wght" ' +
            fmtAxis("wght", v.wght) +
            ', "wdth" ' +
            fmtAxis("wdth", v.wdth) +
            ', "slnt" ' +
            fmtAxis("slnt", v.slnt) +
            ', "CNTR" ' +
            fmtAxis("CNTR", v.CNTR)
          );
        }

        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function lerpFromRange(minEl, maxEl, eased) {
          var start = parseFloat(minEl.value);
          var end = parseFloat(maxEl.value);
          return start + (end - start) * eased;
        }

        function variationAt(eased) {
          return {
            wght: clampAxis("wght", lerpFromRange(els.wMin, els.wMax, eased)),
            CNTR: clampAxis("CNTR", lerpFromRange(els.cMin, els.cMax, eased)),
            wdth: clampAxis("wdth", lerpFromRange(els.dMin, els.dMax, eased)),
            slnt: clampAxis("slnt", lerpFromRange(els.sMin, els.sMax, eased)),
          };
        }

        function applyVariation(v) {
          probe.style.fontVariationSettings = fvarSettings(v);
        }

        var readoutEls = {
          wght: document.getElementById("readoutWght"),
          CNTR: document.getElementById("readoutCntr"),
          wdth: document.getElementById("readoutWdth"),
          slnt: document.getElementById("readoutSlnt"),
        };

        function updateVarReadout(v) {
          readoutEls.wght.textContent = fmtReadout("wght", v.wght);
          readoutEls.CNTR.textContent = fmtReadout("CNTR", v.CNTR);
          readoutEls.wdth.textContent = fmtReadout("wdth", v.wdth);
          readoutEls.slnt.textContent = fmtReadout("slnt", v.slnt);
        }

        function getText() {
          var v = els.ch ? els.ch.value : "";
          if (!v) return DEFAULTS.ch;
          return v;
        }

        function applyChar() {
          probe.textContent = getText();
        }

        function outlineScale() {
          return parseFloat(els.os.value) / 100;
        }

        function outlineStyleOpts() {
          return {
            strokeWidth: parseFloat(els.sw.value),
            nodeSize: parseFloat(els.ns.value),
            handleSize: parseFloat(els.hs.value),
            nodeStrokeWidth: parseFloat(els.nsw.value),
            handleStrokeWidth: parseFloat(els.hsw.value),
            nodeFill: els.nf && els.nf.value === "filled",
            handleFill: els.hf && els.hf.value === "filled",
          };
        }

        var KERN_DUAL = {
          minKey: "kn0",
          maxKey: "kn1",
          fill: "knFill",
          minVal: "kn0Val",
          maxVal: "kn1Val",
        };

        var FS_DUAL = {
          minKey: "fs0",
          maxKey: "fs1",
          fill: "fsFill",
          minVal: "fs0Val",
          maxVal: "fs1Val",
        };

        function clampFs(v) {
          return Math.min(FS.max, Math.max(FS.min, v));
        }

        function fontSizeAt(eased) {
          var start = parseFloat(els.fs0.value);
          var end = parseFloat(els.fs1.value);
          return start + (end - start) * eased;
        }

        function applyFontSize(eased) {
          root.style.setProperty("--fs", fontSizeAt(eased));
        }

        function fmtFsPx(v) {
          return Math.round(Number(v)) + "px";
        }

        function fsDualForKey(key) {
          return key === FS_DUAL.minKey || key === FS_DUAL.maxKey ? FS_DUAL : null;
        }

        function updateFsDualUI() {
          var minEl = els.fs0;
          var maxEl = els.fs1;
          var fill = document.getElementById(FS_DUAL.fill);
          var a = parseFloat(minEl.value);
          var b = parseFloat(maxEl.value);
          var min = parseFloat(minEl.min);
          var max = parseFloat(maxEl.max);
          var lo = Math.min(a, b);
          var hi = Math.max(a, b);
          var loPct = ((lo - min) / (max - min)) * 100;
          var hiPct = ((hi - min) / (max - min)) * 100;
          fill.style.left = loPct + "%";
          fill.style.width = Math.max(0, hiPct - loPct) + "%";
          document.getElementById(FS_DUAL.minVal).textContent = fmtFsPx(a);
          document.getElementById(FS_DUAL.maxVal).textContent = fmtFsPx(b);
          document.getElementById(FS_DUAL.minVal).style.left = thumbPct(els.fs0) + "%";
          document.getElementById(FS_DUAL.maxVal).style.left = thumbPct(els.fs1) + "%";
        }

        function fmtKernPct(v) {
          var n = Math.round(Number(v));
          return (n > 0 ? "+" : "") + n + "%";
        }

        function kerningPxAt(eased) {
          var start = parseFloat(els.kn0.value);
          var end = parseFloat(els.kn1.value);
          var pct = start + (end - start) * eased;
          return (pct / 100) * fontSizeAt(eased);
        }

        function kernDualForKey(key) {
          return key === KERN_DUAL.minKey || key === KERN_DUAL.maxKey ? KERN_DUAL : null;
        }

        function updateKernDualUI() {
          var minEl = els.kn0;
          var maxEl = els.kn1;
          var fill = document.getElementById(KERN_DUAL.fill);
          var a = parseFloat(minEl.value);
          var b = parseFloat(maxEl.value);
          var min = parseFloat(minEl.min);
          var max = parseFloat(minEl.max);
          var lo = Math.min(a, b);
          var hi = Math.max(a, b);
          var loPct = ((lo - min) / (max - min)) * 100;
          var hiPct = ((hi - min) / (max - min)) * 100;
          fill.style.left = loPct + "%";
          fill.style.width = Math.max(0, hiPct - loPct) + "%";
          document.getElementById(KERN_DUAL.minVal).textContent = fmtKernPct(a);
          document.getElementById(KERN_DUAL.maxVal).textContent = fmtKernPct(b);
          document.getElementById(KERN_DUAL.minVal).style.left = thumbPct(els.kn0) + "%";
          document.getElementById(KERN_DUAL.maxVal).style.left = thumbPct(els.kn1) + "%";
        }

        function outlineColor() {
          return els.ln && els.ln.value
            ? els.ln.value
            : getComputedStyle(root).getPropertyValue("--line").trim() || "#0078ff";
        }

        function syncOutlines(v, extra, eased) {
          if (!window.GlyphOutlines) return;
          var t = eased != null && isFinite(eased) ? eased : 0;
          applyFontSize(t);
          var variation = v || variationAt(t);
          var color = outlineColor();
          outlineSvg.style.color = color;
          var opts = {
            fontUrl: FONT_URL,
            root: root,
            color: color,
            outlineScale: outlineScale(),
            fontSize: fontSizeAt(t),
            tracking: kerningPxAt(t),
            leading: parseFloat(els.lh.value),
            offsetY: parseFloat(els.oy.value) || 0,
            stableAnchor: true,
            alignY: "top",
          };
          Object.assign(opts, outlineStyleOpts());
          if (extra) Object.assign(opts, extra);
          GlyphOutlines.sync(
            outlineSvg,
            stage,
            [{ el: probe, text: getText(), variation: variation }],
            opts
          );
        }

        function applyAxisLimits() {
          DUAL_AXES.forEach(function (spec) {
            var a = AXES[spec.tag];
            [els[spec.minKey], els[spec.maxKey]].forEach(function (el) {
              el.min = a.min;
              el.max = a.max;
              el.step = a.step;
            });
          });
        }

        function thumbPct(el) {
          var min = parseFloat(el.min);
          var max = parseFloat(el.max);
          return ((parseFloat(el.value) - min) / (max - min)) * 100;
        }

        function updateDualUI(spec) {
          var minEl = els[spec.minKey];
          var maxEl = els[spec.maxKey];
          var fill = document.getElementById(spec.fill);
          var minValEl = document.getElementById(spec.minVal);
          var maxValEl = document.getElementById(spec.maxVal);
          var a = parseFloat(minEl.value);
          var b = parseFloat(maxEl.value);
          var min = parseFloat(minEl.min);
          var max = parseFloat(minEl.max);
          var lo = Math.min(a, b);
          var hi = Math.max(a, b);
          var loPct = ((lo - min) / (max - min)) * 100;
          var hiPct = ((hi - min) / (max - min)) * 100;
          fill.style.left = loPct + "%";
          fill.style.width = Math.max(0, hiPct - loPct) + "%";
          minValEl.textContent = fmtAxis(spec.tag, a);
          maxValEl.textContent = fmtAxis(spec.tag, b);
          minValEl.style.left = thumbPct(minEl) + "%";
          maxValEl.style.left = thumbPct(maxEl) + "%";
        }

        function updateAllDualUI() {
          DUAL_AXES.forEach(updateDualUI);
        }

        function applyElapsed(elapsed) {
          var cycle = Math.max(200, parseFloat(els.cy.value));
          var hold = Math.max(0, parseFloat(els.hd.value));
          var halfCycle = cycle / 2;
          var total = cycle + 2 * hold;
          if (total <= 0) total = 1;
          var t = elapsed % total;
          if (t < 0) t += total;
          var p;

          if (t < halfCycle) {
            p = t / halfCycle;
          } else if (t < halfCycle + hold) {
            p = 1;
          } else if (t < halfCycle + hold + halfCycle) {
            p = 1 - (t - halfCycle - hold) / halfCycle;
          } else {
            p = 0;
          }

          var eased = easeInOutCubic(p);
          var v = variationAt(eased);
          applyFontSize(eased);
          applyVariation(v);
          updateVarReadout(v);
          syncOutlines(v, null, eased);
        }

        function frame(now) {
          applyElapsed(now - t0);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function durationMs() {
          var cycle = Math.max(200, parseFloat(els.cy.value));
          var hold = Math.max(0, parseFloat(els.hd.value));
          return Math.max(1, cycle + 2 * hold);
        }

        function stopPlayback() {
          playing = false;
          cancelAnimationFrame(raf);
          raf = 0;
        }

        function startPlayback() {
          playing = true;
          restart();
        }

        function restart() {
          t0 = performance.now();
          applyElapsed(0);
          cancelAnimationFrame(raf);
          if (playing) raf = requestAnimationFrame(frame);
        }

        var LS_KEY = "animator:v2:technical-outline:settings:v1";
        var DEFAULTS = {
          bg: "#ffffff",
          ln: "#0078ff",
          ch: "A",
          fs0: 900,
          fs1: 900,
          os: 100,
          lh: 1.3,
          kn0: 0,
          kn1: 0,
          oy: 0,
          sw: 1.25,
          ns: 9,
          hs: 8,
          nsw: 1,
          hsw: 1,
          nf: "outline",
          hf: "outline",
          wMin: 200,
          wMax: 1000,
          cMin: 0,
          cMax: 100,
          dMin: 65,
          dMax: 130,
          sMin: 0,
          sMax: -12,
          cy: 5200,
          hd: 450,
        };

        var COLOR_KEYS = { bg: 1, ln: 1 };
        var STRING_KEYS = { ch: 1, nf: 1, hf: 1 };
        var els = {
          bg: document.getElementById("bg"),
          ln: document.getElementById("ln"),
          ch: document.getElementById("ch"),
          fs0: document.getElementById("fs0"),
          fs1: document.getElementById("fs1"),
          os: document.getElementById("os"),
          lh: document.getElementById("lh"),
          kn0: document.getElementById("kn0"),
          kn1: document.getElementById("kn1"),
          oy: document.getElementById("oy"),
          sw: document.getElementById("sw"),
          ns: document.getElementById("ns"),
          hs: document.getElementById("hs"),
          nsw: document.getElementById("nsw"),
          hsw: document.getElementById("hsw"),
          nf: document.getElementById("nf"),
          hf: document.getElementById("hf"),
          wMin: document.getElementById("wMin"),
          wMax: document.getElementById("wMax"),
          cMin: document.getElementById("cMin"),
          cMax: document.getElementById("cMax"),
          dMin: document.getElementById("dMin"),
          dMax: document.getElementById("dMax"),
          sMin: document.getElementById("sMin"),
          sMax: document.getElementById("sMax"),
          cy: document.getElementById("cy"),
          hd: document.getElementById("hd"),
        };

        var vals = {
          bg: document.getElementById("bgVal"),
          ln: document.getElementById("lnVal"),
          os: document.getElementById("osVal"),
          lh: document.getElementById("lhVal"),
          oy: document.getElementById("oyVal"),
          sw: document.getElementById("swVal"),
          ns: document.getElementById("nsVal"),
          hs: document.getElementById("hsVal"),
          nsw: document.getElementById("nswVal"),
          hsw: document.getElementById("hswVal"),
          cy: document.getElementById("cyVal"),
          hd: document.getElementById("hdVal"),
        };

        function dualSpecForKey(key) {
          for (var i = 0; i < DUAL_AXES.length; i++) {
            if (DUAL_AXES[i].minKey === key || DUAL_AXES[i].maxKey === key) return DUAL_AXES[i];
          }
          return null;
        }

        function fmt(key, v) {
          if (key === "bg" || key === "ln") return String(v).toLowerCase();
          if (key === "os") return (Number(v) / 100).toFixed(2) + "×";
          if (key === "lh") return Number(v).toFixed(2);
          if (key === "oy") return Math.round(Number(v)) + "px";
          if (key === "sw" || key === "nsw" || key === "hsw") return Number(v).toFixed(2);
          if (key === "ns" || key === "hs") return Number(v).toFixed(1);
          if (key === "cy") return (Number(v) / 1000).toFixed(1) + "s";
          if (key === "hd") return Math.round(Number(v)) + "ms";
          return String(v);
        }

        function applyVar(key, v) {
          if (key === "bg") root.style.setProperty("--bg", v);
          else if (key === "ln") {
            root.style.setProperty("--line", v);
            outlineSvg.style.color = v;
          } else if (key === "lh") {
            root.style.setProperty("--lh", String(v));
          }
        }

        function setValue(key, v, persist) {
          var spec = dualSpecForKey(key);
          var kernSpec = kernDualForKey(key);
          var fsSpec = fsDualForKey(key);
          if (spec) v = clampAxis(spec.tag, v);
          else if (fsSpec) v = clampFs(v);
          els[key].value = v;
          if (spec) updateDualUI(spec);
          else if (kernSpec) updateKernDualUI();
          else if (fsSpec) updateFsDualUI();
          else if (vals[key]) vals[key].textContent = fmt(key, v);
          if (key === "ch") applyChar();
          applyVar(key, v);
          if (
            key === "ln" ||
            key === "bg" ||
            key === "os" ||
            key === "lh" ||
            key === "ch" ||
            key === "sw" ||
            key === "ns" ||
            key === "hs" ||
            key === "nsw" ||
            key === "hsw" ||
            key === "nf" ||
            key === "hf" ||
            key === "kn0" ||
            key === "kn1" ||
            key === "fs0" ||
            key === "fs1" ||
            key === "oy"
          ) {
            var previewEased =
              key === "kn1" || key === "fs1" ? 1 : key === "kn0" || key === "fs0" ? 0 : 0;
            syncOutlines(variationAt(previewEased), null, previewEased);
          }
          if (persist !== false) save();
        }

        function save() {
          var out = {};
          Object.keys(els).forEach(function (k) {
            out[k] = COLOR_KEYS[k] || STRING_KEYS[k] ? els[k].value : parseFloat(els[k].value);
          });
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(out));
          } catch (e) {}
        }

        function load() {
          var raw = null;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {}
          var data = DEFAULTS;
          if (raw) {
            try {
              data = Object.assign({}, DEFAULTS, JSON.parse(raw));
              if (data.kn0 == null && data.kn1 == null) {
                if (data.kn != null) {
                  data.kn0 = data.kn;
                  data.kn1 = data.kn;
                } else if (data.ks != null || data.ke != null) {
                  data.kn0 = data.ks != null ? data.ks : 0;
                  data.kn1 = data.ke != null ? data.ke : data.kn0;
                }
              }
              if (data.fs != null && data.fs0 == null) {
                data.fs0 = data.fs;
                data.fs1 = data.fs;
              }
            } catch (e) {}
          }
          if (!raw) {
            try {
              var legacy = localStorage.getItem("technical-outline:v2");
              if (legacy) {
                var old = JSON.parse(legacy);
                data = Object.assign({}, DEFAULTS, old);
              }
            } catch (e2) {}
          }
          Object.keys(els).forEach(function (k) {
            setValue(k, data[k], false);
          });
        }

        Object.keys(els).forEach(function (k) {
          els[k].addEventListener("input", function () {
            var v = COLOR_KEYS[k] || STRING_KEYS[k] ? els[k].value : parseFloat(els[k].value);
            setValue(k, v);
          });
        });

        applyAxisLimits();
        load();
        applyChar();
        updateAllDualUI();
        updateKernDualUI();
        updateFsDualUI();

        function start() {
          var v0 = variationAt(0);
          applyFontSize(0);
          applyVariation(v0);
          updateVarReadout(v0);
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () {
              syncOutlines(v0, null, 0);
              restart();
            });
          } else {
            syncOutlines(v0, null, 0);
            restart();
          }
        }

        start();

        window.AnimatorExport = {
          stage: document.getElementById("stage"),
          filename: "technical-outline.mp4",
          durationMs: durationMs,
          seek: function (ms) {
            applyElapsed(ms);
          },
          stop: stopPlayback,
          start: startPlayback,
        };
      })();
    </script>
    <script type="module" src="../../web-export.js?v=6"></script>
  </body>
