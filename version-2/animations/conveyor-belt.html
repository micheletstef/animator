<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>conveyor belt</title>
    <style>
      @font-face {
        font-family: "IkarusPlusVariable";
        src: url("../../fonts/ABCIkarusPlusVariable.ttf") format("truetype-variations");
        font-weight: 100 1000;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: light;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffffff;
        --fg: #000000;
        --oy: 0;
        --ox: 0;
        --wght: 1000;
        --wdth: 100;
        --cntr: 0;
        --slnt: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d3d3d3;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #1f1f1f;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        font-family: "IkarusPlusVariable", sans-serif;
        font-synthesis: none;
        font-feature-settings: "liga" 1, "kern" 1;
        font-variation-settings:
          "wght" var(--wght),
          "wdth" var(--wdth),
          "CNTR" var(--cntr),
          "slnt" var(--slnt);
        pointer-events: none;
      }

      .belt {
        position: absolute;
        top: 0;
        left: 50%;
        will-change: transform;
      }

      .tile {
        position: relative;
        overflow: visible;
      }

      .g {
        position: absolute;
        left: 0;
        top: 0;
        line-height: 1;
        white-space: nowrap;
        transform-origin: 0 0;
        font-kerning: none;
        font-synthesis: none;
        font-variation-settings: inherit;
        -webkit-font-smoothing: antialiased;
      }

      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }

      .panel .hint {
        margin: 0 0 14px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .panel .group {
        margin-bottom: 18px;
      }

      .panel .group-title {
        text-transform: lowercase;
        color: #6a6a6a;
        margin: 0 0 8px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 2px;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .now {
        margin: 0 0 10px 0;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      .panel .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .panel button {
        flex: 1;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        padding: 6px 8px;
        font: inherit;
        text-transform: lowercase;
        cursor: pointer;
        border-radius: 4px;
      }

      .panel button:hover {
        border-color: #555;
        color: #fff;
      }
    </style>
    <link rel="stylesheet" href="../../animation-chrome.css?v=6" />
  </head>
  <body>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-outer">
        <div class="stage" id="stage" aria-label="conveyor belt">
          <div class="belt" id="belt"></div>
        </div>
      </div>
    </div>
    <aside class="panel" aria-label="Settings">
      <h2>settings</h2>
      <p class="hint">
        scroll to zoom · drag to pan · double-click to fit · 1080 × 1440
      </p>

      <div class="group">
        <p class="group-title">color</p>
        <div class="row">
          <label for="bg">bg</label>
          <input id="bg" type="color" value="#ffffff" />
          <span class="val" id="bgVal">#ffffff</span>
        </div>
        <div class="row">
          <label for="fg">text</label>
          <input id="fg" type="color" value="#000000" />
          <span class="val" id="fgVal">#000000</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">composition</p>
        <div class="row">
          <label for="col">width</label>
          <input id="col" type="range" min="420" max="1080" step="2" value="1080" />
          <span class="val" id="colVal">1080px</span>
        </div>
        <div class="row">
          <label for="pack">fill</label>
          <input id="pack" type="range" min="0.65" max="1" step="0.01" value="0.96" />
          <span class="val" id="packVal">0.96</span>
        </div>
        <div class="row">
          <label for="gap">gap</label>
          <input id="gap" type="range" min="0" max="32" step="1" value="6" />
          <span class="val" id="gapVal">6px</span>
        </div>
        <div class="row">
          <label for="ox">x</label>
          <input id="ox" type="range" min="-360" max="360" step="1" value="0" />
          <span class="val" id="oxVal">0px</span>
        </div>
        <div class="row">
          <label for="oy">y</label>
          <input id="oy" type="range" min="-720" max="720" step="1" value="0" />
          <span class="val" id="oyVal">0px</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">variables</p>
        <div class="row">
          <label for="slnt">slnt</label>
          <input id="slnt" type="range" min="-12" max="0" step="0.25" value="0" />
          <span class="val" id="slntVal">0</span>
        </div>
        <div class="row">
          <label for="wdth">wdth</label>
          <input id="wdth" type="range" min="65" max="130" step="1" value="100" />
          <span class="val" id="wdthVal">100</span>
        </div>
        <div class="row">
          <label for="wght">wght</label>
          <input id="wght" type="range" min="200" max="1000" step="1" value="1000" />
          <span class="val" id="wghtVal">1000</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">contrast · whole artboard 0 → 100 → 0</p>
        <p class="now" id="nowReadout">CNTR 0</p>
        <div class="row">
          <label for="c0">from</label>
          <input id="c0" type="range" min="0" max="100" step="1" value="0" />
          <span class="val" id="c0Val">0</span>
        </div>
        <div class="row">
          <label for="c1">to</label>
          <input id="c1" type="range" min="0" max="100" step="1" value="100" />
          <span class="val" id="c1Val">100</span>
        </div>
        <div class="row">
          <label for="move">move</label>
          <input id="move" type="range" min="200" max="4000" step="20" value="1400" />
          <span class="val" id="moveVal">1400ms</span>
        </div>
        <div class="row">
          <label for="hold">hold</label>
          <input id="hold" type="range" min="0" max="2400" step="50" value="400" />
          <span class="val" id="holdVal">400ms</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">motion · infinite scroll up</p>
        <div class="row">
          <label for="loop">loop</label>
          <input id="loop" type="range" min="8" max="60" step="0.5" value="28" />
          <span class="val" id="loopVal">28s</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="resetBtn">reset</button>
        <button type="button" id="replayBtn">replay</button>
      </div>
    </aside>

    <script src="artboard-view.js?v=8"></script>
    <script>
      (function () {
        var LS_KEY = "animator:v2:conveyor-belt:settings:v6";
        var STAGE_W = 1080;
        var STAGE_H = 1440;
        var PROBE_FS = 200;

        // Ink boxes from the source lockup, cropped to the glyph bounds (x=14).
        var ITEMS = [
          { ch: "?", feat: null },
          { ch: "!", feat: null },
          { ch: ",", feat: "ss13" },
          { ch: "(", feat: null },
          { ch: "*", feat: null },
          { ch: "\u300B", feat: null },
          { ch: "\u2153", feat: null },
          { ch: "\u2463", feat: null },
          { ch: "\u00B6", feat: null },
        ];

        var root = document.documentElement;
        var stageEl = document.getElementById("stage");
        var belt = document.getElementById("belt");
        var nowReadout = document.getElementById("nowReadout");

        var DEFAULTS = {
          bg: "#ffffff",
          fg: "#000000",
          col: 1080,
          pack: 0.96,
          gap: 6,
          ox: 0,
          oy: 0,
          slnt: 0,
          wdth: 100,
          wght: 1000,
          c0: 0,
          c1: 100,
          move: 1400,
          hold: 400,
          loop: 28,
        };

        var COLOR_KEYS = { bg: 1, fg: 1 };

        var els = {};
        var vals = {
          bg: document.getElementById("bgVal"),
          fg: document.getElementById("fgVal"),
          col: document.getElementById("colVal"),
          pack: document.getElementById("packVal"),
          gap: document.getElementById("gapVal"),
          ox: document.getElementById("oxVal"),
          oy: document.getElementById("oyVal"),
          slnt: document.getElementById("slntVal"),
          wdth: document.getElementById("wdthVal"),
          wght: document.getElementById("wghtVal"),
          c0: document.getElementById("c0Val"),
          c1: document.getElementById("c1Val"),
          move: document.getElementById("moveVal"),
          hold: document.getElementById("holdVal"),
          loop: document.getElementById("loopVal"),
        };

        Object.keys(DEFAULTS).forEach(function (key) {
          els[key] = document.getElementById(key);
        });

        var glyphEls = [];
        var tileH = 0;
        var copyCount = 0;
        var scrollY = 0;
        var t0 = 0;
        var raf = 0;
        var playing = true;
        var fitKey = "";

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function clamp(n, lo, hi) {
          return Math.max(lo, Math.min(hi, n));
        }

        function ease(t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          return 0.5 - 0.5 * Math.cos(Math.PI * t);
        }

        function packValue() {
          var n = Number(els.pack.value);
          return isFinite(n) && n > 0 ? n : 0.96;
        }

        function gapValue() {
          var n = Number(els.gap.value);
          return isFinite(n) ? Math.max(0, n) : 6;
        }

        function hash01(i, salt) {
          var x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
          return x - Math.floor(x);
        }

        function stageScale() {
          var w = stageEl.getBoundingClientRect().width;
          return w > 0 ? w / STAGE_W : 1;
        }

        function applyFeature(el, feat) {
          if (feat) {
            el.style.fontFeatureSettings =
              '"' + feat + '" 1, "liga" 1, "kern" 1';
          } else {
            el.style.fontFeatureSettings = '"liga" 1, "kern" 1';
          }
        }

        function makeGlyph(item) {
          var el = document.createElement("span");
          el.className = "g";
          el.textContent = item.ch;
          applyFeature(el, item.feat);
          el.style.fontSize = PROBE_FS + "px";
          el.style.fontWeight = String(Math.round(Number(els.wght.value) || 1000));
          return el;
        }

        function build() {
          var col = Number(els.col.value) || 1080;
          tileH = STAGE_H;
          copyCount = 4;
          belt.innerHTML = "";
          glyphEls = [];
          var c;
          for (c = 0; c < copyCount; c++) {
            var tile = document.createElement("div");
            tile.className = "tile";
            tile.style.width = col + "px";
            tile.style.height = tileH + "px";
            ITEMS.forEach(function (item) {
              var el = makeGlyph(item);
              el._item = item;
              el._tile = tile;
              el._copy = c;
              tile.appendChild(el);
              glyphEls.push(el);
            });
            belt.appendChild(tile);
          }
          belt.style.width = col + "px";
          fitKey = "";
          layoutBelt();
          belt.offsetHeight;
          fitAll();
        }

        function layoutBelt() {
          var col = Number(els.col.value) || 1080;
          var ox = Number(els.ox.value) || 0;
          var oy = Number(els.oy.value) || 0;
          belt.style.marginLeft = -col / 2 + ox + "px";
          belt.style.top = oy + "px";
        }

        function inkRect(el) {
          var range = document.createRange();
          range.selectNodeContents(el);
          var rects = range.getClientRects();
          var r = rects.length ? rects[0] : range.getBoundingClientRect();
          if (!r || r.width < 0.5 || r.height < 0.5) {
            r = el.getBoundingClientRect();
          }
          return r;
        }

        function fitAll() {
          var col = Number(els.col.value) || 1080;
          var pack = packValue();
          var gap = gapValue();
          var sc = stageScale();
          var key =
            col +
            "|" +
            pack +
            "|" +
            gap +
            "|" +
            els.wght.value +
            "|" +
            els.wdth.value +
            "|" +
            els.slnt.value +
            "|" +
            sc.toFixed(4);
          if (key === fitKey) return;
          fitKey = key;

          root.style.setProperty("--cntr", "0");

          glyphEls.forEach(function (el) {
            el.style.left = "0px";
            el.style.top = "0px";
            el.style.fontSize = PROBE_FS + "px";
            el.style.transform = "none";
          });

          var n = ITEMS.length;
          var inks = [];
          var i;
          var maxW = 0;
          for (i = 0; i < n; i++) {
            var el = glyphEls[i];
            var r = inkRect(el);
            var tileR = el._tile.getBoundingClientRect();
            var ink = {
              l: (r.left - tileR.left) / sc,
              t: (r.top - tileR.top) / sc,
              w: r.width / sc,
              h: r.height / sc,
            };
            inks.push(ink);
            if (ink.w > maxW) maxW = ink.w;
          }
          if (maxW < 0.5) return;

          var g = Math.max(2, gap * (1.35 - pack));
          var k = ((col * 0.5 - g) * pack) / maxW;
          var mid = col / 2;
          var colH = [g, g + inks[0].h * k * (0.28 + 0.22 * hash01(0, 3))];
          var boxes = [];

          for (i = 0; i < n; i++) {
            var w = inks[i].w * k;
            var h = inks[i].h * k;
            var c = i % 2;
            if (hash01(i, 1) > 0.62) c = 1 - c;
            var jitterX = (hash01(i, 2) - 0.5) * w * 0.22;
            var jitterY = (hash01(i, 4) - 0.45) * g * 1.8;
            var x;
            if (c === 0) {
              x = mid - g * 0.35 - w + jitterX;
            } else {
              x = mid + g * 0.35 + jitterX;
            }
            x = clamp(x, g * 0.25, col - w - g * 0.25);
            var y = colH[c] + jitterY;
            if (y < g * 0.5) y = g * 0.5;
            boxes.push({ x: x, y: y, w: w, h: h, c: c });
            colH[c] = y + h + g * (0.45 + 0.4 * hash01(i, 5));
          }

          var iter;
          var j;
          for (iter = 0; iter < 10; iter++) {
            var moved = false;
            for (i = 0; i < n; i++) {
              for (j = i + 1; j < n; j++) {
                var a = boxes[i];
                var b = boxes[j];
                var ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
                var oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
                if (ox <= g || oy <= g) continue;
                var push = (Math.min(ox, oy) - g) * 0.55;
                if (Math.abs(a.x + a.w / 2 - (b.x + b.w / 2)) >=
                    Math.abs(a.y + a.h / 2 - (b.y + b.h / 2))) {
                  if (a.x + a.w / 2 < b.x + b.w / 2) {
                    a.x -= push / 2;
                    b.x += push / 2;
                  } else {
                    a.x += push / 2;
                    b.x -= push / 2;
                  }
                } else {
                  if (a.y + a.h / 2 < b.y + b.h / 2) {
                    a.y -= push / 2;
                    b.y += push / 2;
                  } else {
                    a.y += push / 2;
                    b.y -= push / 2;
                  }
                }
                a.x = clamp(a.x, 0, col - a.w);
                b.x = clamp(b.x, 0, col - b.w);
                if (a.y < 0) a.y = 0;
                if (b.y < 0) b.y = 0;
                moved = true;
              }
            }
            if (!moved) break;
          }

          tileH = 0;
          var poses = [];
          for (i = 0; i < n; i++) {
            var box = boxes[i];
            poses.push({
              tx: box.x - inks[i].l * k,
              ty: box.y - inks[i].t * k,
              k: k,
            });
            tileH = Math.max(tileH, box.y + box.h + g);
          }

          var tiles = belt.querySelectorAll(".tile");
          for (i = 0; i < tiles.length; i++) {
            tiles[i].style.height = tileH + "px";
          }

          for (i = 0; i < glyphEls.length; i++) {
            var pose = poses[i % n];
            glyphEls[i].style.transform =
              "translate(" +
              pose.tx +
              "px, " +
              pose.ty +
              "px) scale(" +
              pose.k +
              ")";
          }
        }

        function sampleCntr(elapsed) {
          var c0 = Number(els.c0.value);
          var c1 = Number(els.c1.value);
          if (!isFinite(c0)) c0 = 0;
          if (!isFinite(c1)) c1 = 100;
          var move = Math.max(80, Number(els.move.value) || 1400);
          var hold = Math.max(0, Number(els.hold.value) || 0);
          var seg = move + hold;
          var total = seg * 2;
          var t = elapsed % total;
          if (t < hold) return c0;
          if (t < hold + move) return lerp(c0, c1, ease((t - hold) / move));
          if (t < hold + move + hold) return c1;
          return lerp(c1, c0, ease((t - hold - move - hold) / move));
        }

        function applyContrast(cntr) {
          root.style.setProperty("--cntr", String(cntr));
          nowReadout.textContent = "CNTR " + Math.round(cntr);
        }

        function applyElapsed(elapsed) {
          var loop = Number(els.loop.value);
          if (!isFinite(loop) || loop < 1) loop = 28;
          scrollY = tileH ? (((elapsed / 1000) % loop) / loop) * tileH : 0;
          var oy = Number(els.oy.value) || 0;
          belt.style.transform = "translateY(" + -scrollY + "px)";
          belt.style.top = oy + "px";
          applyContrast(sampleCntr(elapsed));
        }

        function frame(now) {
          applyElapsed(now - t0);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function durationMs() {
          var loop = Number(els.loop.value);
          if (!isFinite(loop) || loop < 1) loop = 28;
          return loop * 1000;
        }

        function stopPlayback() {
          playing = false;
          cancelAnimationFrame(raf);
          raf = 0;
        }

        function startPlayback() {
          playing = true;
          restart();
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        }

        function restart() {
          t0 = performance.now();
        }

        function fmt(key, v) {
          if (COLOR_KEYS[key]) return String(v).toLowerCase();
          if (key === "slnt") return Number(v).toFixed(2).replace(/\.00$/, "");
          if (key === "pack") return Number(v).toFixed(2);
          if (key === "loop") return Number(v).toFixed(1).replace(/\.0$/, "") + "s";
          if (key === "wdth" || key === "wght" || key === "c0" || key === "c1") {
            return String(Math.round(Number(v)));
          }
          if (key === "move" || key === "hold") {
            return Math.round(Number(v)) + "ms";
          }
          return Math.round(Number(v)) + "px";
        }

        function applyVars() {
          root.style.setProperty("--bg", els.bg.value);
          root.style.setProperty("--fg", els.fg.value);
          root.style.setProperty("--ox", String(els.ox.value));
          root.style.setProperty("--oy", String(els.oy.value));
          root.style.setProperty("--wght", String(els.wght.value));
          root.style.setProperty("--wdth", String(els.wdth.value));
          root.style.setProperty("--slnt", String(els.slnt.value));
        }

        function paintVals() {
          Object.keys(vals).forEach(function (key) {
            if (!vals[key] || !els[key]) return;
            vals[key].textContent = fmt(key, els[key].value);
          });
        }

        function save() {
          var data = {};
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            data[key] = els[key].value;
          });
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(data));
          } catch (e) {}
        }

        function loadSaved() {
          var raw = null;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {}
          if (!raw) return;
          var data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            return;
          }
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key] || data[key] == null) return;
            els[key].value = data[key];
          });
        }

        function reset() {
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            els[key].value = DEFAULTS[key];
          });
          try {
            localStorage.removeItem(LS_KEY);
          } catch (e) {}
          applyVars();
          paintVals();
          build();
          restart();
          if (window.ArtboardView && window.ArtboardView.reset) {
            window.ArtboardView.reset();
          }
        }

        Object.keys(els).forEach(function (key) {
          if (!els[key]) return;
          els[key].addEventListener("input", function () {
            applyVars();
            paintVals();
            save();
            if (key === "col" || key === "pack" || key === "gap") {
              build();
            } else if (key === "ox" || key === "oy") {
              layoutBelt();
            } else if (key === "wght" || key === "wdth" || key === "slnt") {
              fitKey = "";
              glyphEls.forEach(function (el) {
                el.style.fontWeight = String(
                  Math.round(Number(els.wght.value) || 1000)
                );
              });
              fitAll();
            }
          });
        });

        document.getElementById("resetBtn").addEventListener("click", reset);
        document.getElementById("replayBtn").addEventListener("click", restart);

        if (typeof ResizeObserver !== "undefined") {
          var ro = new ResizeObserver(function () {
            fitKey = "";
            fitAll();
          });
          ro.observe(stageEl);
        }

        function start() {
          loadSaved();
          applyVars();
          paintVals();
          build();
          restart();
          raf = requestAnimationFrame(frame);
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(start).catch(start);
        } else {
          start();
        }

        window.AnimatorExport = {
          stage: document.getElementById("stage"),
          filename: "conveyor-belt.mp4",
          durationMs: durationMs,
          seek: applyElapsed,
          stop: stopPlayback,
          start: startPlayback,
        };
      })();
    </script>
    <script type="module" src="../../web-export.js?v=4"></script>
  </body>
</html>
