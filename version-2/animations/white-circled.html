<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>white circled</title>
    <style>
      @font-face {
        font-family: "IkarusPlusVariable";
        src: url("../../fonts/ABCIkarusPlusVariable.ttf") format("truetype-variations");
        font-weight: 100 1000;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: dark;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffffff;
        --fg: #000000;
        --pad-t: 96;
        --pad-r: 80;
        --pad-b: 96;
        --pad-l: 80;
        --fs: 260;
        --lh: 1.06;
        --tracking: 0;
        --oy: 0;
        --wght: 800;
        --wdth: 90;
        --cntr: 0;
        --slnt: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #e9e9e9;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        font-family: "IkarusPlusVariable", sans-serif;
        font-synthesis: none;
        font-feature-settings: "ss16" 1, "liga" 1, "kern" 1;
        font-variation-settings:
          "wght" var(--wght),
          "wdth" var(--wdth),
          "CNTR" var(--cntr),
          "slnt" var(--slnt);
        pointer-events: none;
      }

      .lockup {
        position: absolute;
        top: calc(var(--pad-t) * 1px);
        right: calc(var(--pad-r) * 1px);
        bottom: calc(var(--pad-b) * 1px);
        left: calc(var(--pad-l) * 1px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transform: translateY(calc(var(--oy) * 1px));
      }

      .num {
        display: block;
        width: 100%;
        font-size: calc(var(--fs) * 1px);
        line-height: var(--lh);
        letter-spacing: calc(var(--tracking) * 1em);
        white-space: nowrap;
        font-kerning: none;
        font-variation-settings: inherit;
        transition: none;
      }

      .lockup,
      .num {
        overflow: visible;
      }

      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }

      .panel .hint {
        margin: 0 0 14px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .panel .group {
        margin-bottom: 18px;
      }

      .panel .group-title {
        text-transform: lowercase;
        color: #6a6a6a;
        margin: 0 0 8px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 2px;
      }

      .row textarea {
        grid-column: 2 / 4;
        width: 100%;
        min-height: 92px;
        resize: vertical;
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #111;
        color: #e9e9e9;
        font: inherit;
        line-height: 1.25;
        white-space: pre;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .now {
        margin: 0 0 10px 0;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      .panel .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .panel button {
        flex: 1;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        padding: 6px 8px;
        font: inherit;
        text-transform: lowercase;
        cursor: pointer;
        border-radius: 4px;
      }

      .panel button:hover {
        border-color: #555;
        color: #fff;
      }
    </style>
    <link rel="stylesheet" href="../../animation-chrome.css?v=1" />
  </head>
  <body>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-outer">
        <div class="stage" id="stage" aria-label="white circled">
          <div class="lockup" id="lockup"></div>
        </div>
      </div>
    </div>
    <aside class="panel" aria-label="Settings">
      <h2>settings</h2>
      <p class="hint">scroll to zoom · drag to pan · double-click to fit · 1080 × 1440</p>

      <div class="group">
        <p class="group-title">color</p>
        <div class="row">
          <label for="bg">bg</label>
          <input id="bg" type="color" value="#ffffff" />
          <span class="val" id="bgVal">#ffffff</span>
        </div>
        <div class="row">
          <label for="fg">text</label>
          <input id="fg" type="color" value="#000000" />
          <span class="val" id="fgVal">#000000</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">type</p>
        <div class="row">
          <label for="tx">text</label>
          <textarea id="tx" spellcheck="false" autocomplete="off">12
8
4
0</textarea>
        </div>
        <div class="row">
          <label for="fs">size</label>
          <input id="fs" type="range" min="80" max="420" step="1" value="260" />
          <span class="val" id="fsVal">260px</span>
        </div>
        <div class="row">
          <label for="lh">leading</label>
          <input id="lh" type="range" min="0.7" max="1.4" step="0.01" value="1.06" />
          <span class="val" id="lhVal">1.06</span>
        </div>
        <div class="row">
          <label for="tr">track</label>
          <input id="tr" type="range" min="-0.08" max="0.08" step="0.005" value="0" />
          <span class="val" id="trVal">0.00</span>
        </div>
        <div class="row">
          <label for="oy">y</label>
          <input id="oy" type="range" min="-360" max="360" step="1" value="0" />
          <span class="val" id="oyVal">0px</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">start · then random snaps</p>
        <p class="now" id="nowReadout">wght 800 · wdth 90 · CNTR 0 · slnt 0</p>
        <div class="row">
          <label for="slnt">slnt</label>
          <input id="slnt" type="range" min="-12" max="0" step="0.25" value="0" />
          <span class="val" id="slntVal">0</span>
        </div>
        <div class="row">
          <label for="wdth">wdth</label>
          <input id="wdth" type="range" min="65" max="130" step="1" value="90" />
          <span class="val" id="wdthVal">90</span>
        </div>
        <div class="row">
          <label for="wght">wght</label>
          <input id="wght" type="range" min="200" max="1000" step="1" value="800" />
          <span class="val" id="wghtVal">800</span>
        </div>
        <div class="row">
          <label for="cntr">CNTR</label>
          <input id="cntr" type="range" min="0" max="100" step="1" value="0" />
          <span class="val" id="cntrVal">0</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">motion · one axis at a time</p>
        <div class="row">
          <label for="step">step</label>
          <input id="step" type="range" min="80" max="1600" step="10" value="420" />
          <span class="val" id="stepVal">420ms</span>
        </div>
        <div class="row">
          <label for="hold0">hold in</label>
          <input id="hold0" type="range" min="0" max="2000" step="50" value="600" />
          <span class="val" id="hold0Val">600ms</span>
        </div>
        <div class="row">
          <label for="hold1">hold out</label>
          <input id="hold1" type="range" min="0" max="3000" step="50" value="900" />
          <span class="val" id="hold1Val">900ms</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="resetBtn">reset</button>
        <button type="button" id="replayBtn">replay</button>
      </div>
    </aside>

    <script src="artboard-view.js"></script>
    <script>
      (function () {
        var DEFAULT_TEXT = "12\n8\n4\n0";
        var LS_KEY = "animator:v2:white-circled:settings:v1";
        var AXES = [
          { key: "slnt", tag: "slnt", min: -12, max: 0, step: 0.25 },
          { key: "wdth", tag: "wdth", min: 65, max: 130, step: 1 },
          { key: "wght", tag: "wght", min: 200, max: 1000, step: 1 },
          { key: "cntr", tag: "CNTR", min: 0, max: 100, step: 1 },
        ];

        var root = document.documentElement;
        var lockup = document.getElementById("lockup");
        var nowReadout = document.getElementById("nowReadout");

        var DEFAULTS = {
          bg: "#ffffff",
          fg: "#000000",
          tx: DEFAULT_TEXT,
          fs: 260,
          lh: 1.06,
          tr: 0,
          oy: 0,
          slnt: 0,
          wdth: 90,
          wght: 800,
          cntr: 0,
          step: 420,
          hold0: 600,
          hold1: 900,
        };

        var COLOR_KEYS = { bg: 1, fg: 1 };
        var AXIS_KEYS = { slnt: 1, wdth: 1, wght: 1, cntr: 1 };

        var els = {};
        var vals = {
          bg: document.getElementById("bgVal"),
          fg: document.getElementById("fgVal"),
          fs: document.getElementById("fsVal"),
          lh: document.getElementById("lhVal"),
          tr: document.getElementById("trVal"),
          oy: document.getElementById("oyVal"),
          slnt: document.getElementById("slntVal"),
          wdth: document.getElementById("wdthVal"),
          wght: document.getElementById("wghtVal"),
          cntr: document.getElementById("cntrVal"),
          step: document.getElementById("stepVal"),
          hold0: document.getElementById("hold0Val"),
          hold1: document.getElementById("hold1Val"),
        };

        Object.keys(DEFAULTS).forEach(function (key) {
          els[key] = document.getElementById(key);
        });

        var t0 = 0;
        var cycleIndex = -1;
        var plan = null;
        var lastAxis = "";

        function cloneState(s) {
          return {
            slnt: s.slnt,
            wdth: s.wdth,
            wght: s.wght,
            cntr: s.cntr,
          };
        }

        function startState() {
          return {
            slnt: Number(els.slnt.value),
            wdth: Number(els.wdth.value),
            wght: Number(els.wght.value),
            cntr: Number(els.cntr.value),
          };
        }

        function shuffle(list) {
          var a = list.slice();
          for (var i = a.length - 1; i > 0; i -= 1) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        }

        function snapValue(axis, current) {
          var span = axis.max - axis.min;
          var n = Math.round(span / axis.step);
          if (n <= 0) return axis.min;
          var curIdx = Math.round((current - axis.min) / axis.step);
          var minDelta = Math.max(1, Math.round(n * 0.28));
          var idx = curIdx;
          var tries = 0;
          while (Math.abs(idx - curIdx) < minDelta && tries < 24) {
            idx = Math.floor(Math.random() * (n + 1));
            tries += 1;
          }
          if (idx === curIdx) idx = curIdx < n / 2 ? n : 0;
          var v = axis.min + idx * axis.step;
          if (axis.step < 1) v = Math.round(v / axis.step) * axis.step;
          else v = Math.round(v);
          if (v < axis.min) v = axis.min;
          if (v > axis.max) v = axis.max;
          return v;
        }

        function makePlan(from) {
          var order = shuffle(AXES);
          if (plan && plan.order.length && order[0].key === plan.order[plan.order.length - 1].key) {
            order.push(order.shift());
          }
          var state = cloneState(from);
          var steps = [];
          for (var i = 0; i < order.length; i += 1) {
            var axis = order[i];
            state[axis.key] = snapValue(axis, state[axis.key]);
            steps.push({
              state: cloneState(state),
              axis: axis.key,
            });
          }
          return { from: cloneState(from), order: order, steps: steps };
        }

        function applyState(s, changed) {
          root.style.setProperty("--slnt", String(s.slnt));
          root.style.setProperty("--wdth", String(s.wdth));
          root.style.setProperty("--wght", String(s.wght));
          root.style.setProperty("--cntr", String(s.cntr));
          lastAxis = changed || "";
          nowReadout.textContent =
            (lastAxis ? lastAxis + " · " : "") +
            "wght " +
            Math.round(s.wght) +
            " · wdth " +
            Math.round(s.wdth) +
            " · CNTR " +
            Math.round(s.cntr) +
            " · slnt " +
            Number(s.slnt).toFixed(2).replace(/\.00$/, "");
        }

        function cycleMs() {
          var n = AXES.length;
          var step = Math.max(40, Number(els.step.value) || 420);
          var hold0 = Math.max(0, Number(els.hold0.value) || 0);
          var hold1 = Math.max(0, Number(els.hold1.value) || 0);
          return hold0 + n * step + hold1;
        }

        function frame(now) {
          var n = AXES.length;
          var step = Math.max(40, Number(els.step.value) || 420);
          var hold0 = Math.max(0, Number(els.hold0.value) || 0);
          var total = cycleMs();
          if (total <= 0) total = 1;
          var elapsed = now - t0;
          if (elapsed < 0) elapsed = 0;
          var ci = Math.floor(elapsed / total);
          var local = elapsed - ci * total;

          if (ci !== cycleIndex) {
            var from = plan ? plan.steps[plan.steps.length - 1].state : startState();
            if (ci === 0) from = startState();
            plan = makePlan(from);
            cycleIndex = ci;
          }

          var count;
          if (local < hold0) {
            count = 0;
          } else if (local < hold0 + n * step) {
            count = Math.min(n, 1 + Math.floor((local - hold0) / step));
          } else {
            count = n;
          }

          if (count <= 0) {
            applyState(plan.from, "");
          } else {
            var stepInfo = plan.steps[count - 1];
            applyState(stepInfo.state, stepInfo.axis);
          }
          requestAnimationFrame(frame);
        }

        function buildLockup(text) {
          lockup.innerHTML = "";
          var lines = String(text || "")
            .replace(/\r\n/g, "\n")
            .split("\n");
          if (lines.length === 1 && lines[0] === "") lines = [""];
          lines.forEach(function (line) {
            var el = document.createElement("div");
            el.className = "num";
            el.textContent = line;
            lockup.appendChild(el);
          });
        }

        function restart() {
          t0 = performance.now();
          cycleIndex = -1;
          plan = null;
          applyState(startState(), "");
        }

        function fmt(key, v) {
          if (COLOR_KEYS[key]) return String(v).toLowerCase();
          if (key === "tx") return String(v);
          if (key === "fs" || key === "oy") return Math.round(Number(v)) + "px";
          if (key === "lh" || key === "tr") return Number(v).toFixed(2);
          if (key === "slnt") return Number(v).toFixed(2).replace(/\.00$/, "");
          if (key === "wdth" || key === "wght" || key === "cntr") {
            return String(Math.round(Number(v)));
          }
          return Math.round(Number(v)) + "ms";
        }

        function applyVars() {
          root.style.setProperty("--bg", els.bg.value);
          root.style.setProperty("--fg", els.fg.value);
          root.style.setProperty("--fs", String(els.fs.value));
          root.style.setProperty("--lh", String(els.lh.value));
          root.style.setProperty("--tracking", String(els.tr.value));
          root.style.setProperty("--oy", String(els.oy.value));
        }

        function paintVals() {
          Object.keys(vals).forEach(function (key) {
            if (!vals[key] || !els[key]) return;
            vals[key].textContent = fmt(key, els[key].value);
          });
        }

        function save() {
          var data = {};
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            data[key] = els[key].value;
          });
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(data));
          } catch (e) {}
        }

        function loadSaved() {
          var raw = null;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {}
          if (!raw) return;
          var data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            return;
          }
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key] || data[key] == null) return;
            els[key].value = data[key];
          });
        }

        function reset() {
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            els[key].value = DEFAULTS[key];
          });
          try {
            localStorage.removeItem(LS_KEY);
          } catch (e) {}
          buildLockup(els.tx.value);
          applyVars();
          paintVals();
          restart();
          if (window.ArtboardView && window.ArtboardView.reset) {
            window.ArtboardView.reset();
          }
        }

        Object.keys(els).forEach(function (key) {
          if (!els[key]) return;
          els[key].addEventListener("input", function () {
            if (key === "tx") buildLockup(els.tx.value);
            applyVars();
            paintVals();
            save();
            if (key === "tx" || AXIS_KEYS[key]) restart();
          });
        });

        document.getElementById("resetBtn").addEventListener("click", reset);
        document.getElementById("replayBtn").addEventListener("click", restart);

        loadSaved();
        buildLockup(els.tx.value);
        applyVars();
        paintVals();
        restart();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
