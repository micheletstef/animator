<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>white circled</title>
    <style>
      @font-face {
        font-family: "IkarusPlusVariable";
        src: url("../../fonts/ABCIkarusPlusVariable.ttf") format("truetype-variations");
        font-weight: 100 1000;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: dark;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffffff;
        --fg: #000000;
        --pad-t: 96;
        --pad-r: 80;
        --pad-b: 96;
        --pad-l: 80;
        --fs: 260;
        --lh: 1.06;
        --tracking: 0;
        --oy: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #111;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #e9e9e9;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        font-family: "IkarusPlusVariable", sans-serif;
        font-synthesis: none;
        font-feature-settings: "ss16" 1, "liga" 1, "kern" 1;
        pointer-events: none;
      }

      .lockup {
        position: absolute;
        top: calc(var(--pad-t) * 1px);
        right: calc(var(--pad-r) * 1px);
        bottom: calc(var(--pad-b) * 1px);
        left: calc(var(--pad-l) * 1px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        transform: translateY(calc(var(--oy) * 1px));
      }

      .num {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
        width: 100%;
        height: calc(var(--fs) * var(--lh) * 1px);
        font-size: calc(var(--fs) * 1px);
        line-height: var(--lh);
        letter-spacing: 0;
        white-space: nowrap;
        font-kerning: none;
        transition: none;
      }

      .lockup,
      .num {
        overflow: visible;
      }

      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }

      .panel .hint {
        margin: 0 0 14px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .panel .group {
        margin-bottom: 18px;
      }

      .panel .group-title {
        text-transform: lowercase;
        color: #6a6a6a;
        margin: 0 0 8px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 2px;
      }

      .row textarea {
        grid-column: 2 / 4;
        width: 100%;
        min-height: 92px;
        resize: vertical;
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #111;
        color: #e9e9e9;
        font: inherit;
        line-height: 1.25;
        white-space: pre;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .kf-head,
      .kf-row {
        display: grid;
        grid-template-columns: 40px 1fr 1fr 1fr 1fr;
        gap: 4px;
        align-items: center;
        margin-bottom: 6px;
      }

      .kf-head span {
        text-align: center;
        color: #6a6a6a;
        font-size: 10px;
        text-transform: lowercase;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .kf-head span:first-child {
        text-align: left;
      }

      .kf-row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .kf-row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .now {
        margin: 0 0 10px 0;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      .panel .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .panel button {
        flex: 1;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        padding: 6px 8px;
        font: inherit;
        text-transform: lowercase;
        cursor: pointer;
        border-radius: 4px;
      }

      .panel button:hover {
        border-color: #555;
        color: #fff;
      }
    </style>

  <body>
    <div class="stage-wrap" id="stageWrap">

    <aside class="panel" aria-label="Settings">

      <div class="group">

      <div class="group">
        <p class="group-title">type</p>
        <div class="row">

8
4
0</textarea>

    <script src="artboard-view.js?v=9"></script>
    <script>
      (function () {
        var DEFAULT_TEXT = "12\n8\n4\n0";
        var LS_KEY = "animator:v2:white-circled:settings:v5";
        var LINE_COUNT = 4;
        var AXES = [
          { key: "wdth", min: 65, max: 130, step: 1 },
          { key: "wght", min: 200, max: 1000, step: 1 },
          { key: "cntr", min: 0, max: 100, step: 1 },
        ];

        var root = document.documentElement;
        var lockup = document.getElementById("lockup");
        var nowReadout = document.getElementById("nowReadout");
        var kfHead = document.getElementById("kfHead");

        var DEFAULTS = {
          bg: "#ffffff",
          fg: "#000000",
          tx: DEFAULT_TEXT,
          fs: 260,
          lh: 1.06,
          oy: 0,
          slnt0: 0,
          slnt1: 0,
          slnt2: 0,
          slnt3: 0,
          wdth0: 100,
          wdth1: 118,
          wdth2: 72,
          wdth3: 80,
          wght0: 1000,
          wght1: 320,
          wght2: 940,
          wght3: 260,
          cntr0: 0,
          cntr1: 100,
          cntr2: 8,
          cntr3: 95,
          move: 900,
          amp: 0.55,
          hold0: 600,
          hold1: 900,
        };

        var COLOR_KEYS = { bg: 1, fg: 1 };
        var START_KEYS = {
          slnt0: 1,
          slnt1: 1,
          slnt2: 1,
          slnt3: 1,
          wdth0: 1,
          wdth1: 1,
          wdth2: 1,
          wdth3: 1,
          wght0: 1,
          wght1: 1,
          wght2: 1,
          wght3: 1,
          cntr0: 1,
          cntr1: 1,
          cntr2: 1,
          cntr3: 1,
        };

        var els = {};
        var vals = {
          bg: document.getElementById("bgVal"),
          fg: document.getElementById("fgVal"),
          fs: document.getElementById("fsVal"),
          lh: document.getElementById("lhVal"),
          oy: document.getElementById("oyVal"),
          move: document.getElementById("moveVal"),
          amp: document.getElementById("ampVal"),
          hold0: document.getElementById("hold0Val"),
          hold1: document.getElementById("hold1Val"),
        };

        Object.keys(DEFAULTS).forEach(function (key) {
          els[key] = document.getElementById(key);
        });

        var numEls = [];
        var t0 = 0;
        var raf = 0;
        var playing = true;
        var cycleIndex = -1;
        var plan = null;

        function parseLines(raw) {
          var lines = String(raw || "")
            .replace(/\r\n/g, "\n")
            .split("\n");
          if (lines.length === 1 && lines[0] === "") lines = [""];
          return lines;
        }

        function cloneState(s) {
          return {
            slnt: s.slnt,
            wdth: s.wdth,
            wght: s.wght,
            cntr: s.cntr,
            sz: s.sz,
          };
        }

        function cloneStates(list) {
          return list.map(cloneState);
        }

        function lineState(i) {
          var idx = Math.min(LINE_COUNT - 1, Math.max(0, i));
          return {
            slnt: Number(els["slnt" + idx].value),
            wdth: Number(els["wdth" + idx].value),
            wght: Number(els["wght" + idx].value),
            cntr: Number(els["cntr" + idx].value),
            sz: 1,
          };
        }

        function startStates(n) {
          var out = [];
          for (var i = 0; i < n; i += 1) out.push(lineState(i));
          return out;
        }

        function vfString(s) {
          return (
            '"wght" ' +
            s.wght +
            ', "wdth" ' +
            s.wdth +
            ', "CNTR" ' +
            s.cntr +
            ', "slnt" ' +
            s.slnt
          );
        }

        function shuffle(list) {
          var a = list.slice();
          for (var i = a.length - 1; i > 0; i -= 1) {
            var j = Math.floor(Math.random() * (i + 1));
            var t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        }

        function snapValue(axis, current) {
          var n = Math.round((axis.max - axis.min) / axis.step);
          if (n <= 0) return axis.min;
          var curIdx = Math.round((current - axis.min) / axis.step);
          var minDelta = Math.max(1, Math.round(n * 0.32));
          var idx = curIdx;
          var tries = 0;
          while (Math.abs(idx - curIdx) < minDelta && tries < 24) {
            if (Math.random() < 0.5) {
              idx = Math.floor(Math.random() * Math.floor(n * 0.38 + 1));
            } else {
              idx = n - Math.floor(Math.random() * Math.floor(n * 0.38 + 1));
            }
            tries += 1;
          }
          if (idx === curIdx) idx = curIdx < n / 2 ? n : 0;
          var v = axis.min + idx * axis.step;
          if (axis.step < 1) v = Math.round(v / axis.step) * axis.step;
          else v = Math.round(v);
          if (v < axis.min) v = axis.min;
          if (v > axis.max) v = axis.max;
          return v;
        }

        function randomState(from) {
          var next = cloneState(from);
          for (var i = 0; i < AXES.length; i += 1) {
            var axis = AXES[i];
            next[axis.key] = snapValue(axis, from[axis.key]);
          }
          return next;
        }

        function sizeAmp() {
          var a = Number(els.amp.value);
          if (!isFinite(a) || a < 0) return 0;
          if (a > 0.75) return 0.75;
          return a;
        }

        function randomizeSizes(states, idx) {
          var n = states.length;
          if (n <= 1) return;
          var amp = sizeAmp();
          if (amp <= 0) {
            for (var z = 0; z < n; z += 1) states[z].sz = 1;
            return;
          }
          var min = Math.max(0.28, 1 - amp);
          var maxAllowed = n - (n - 1) * min;
          var minAllowed = min;
          if (maxAllowed <= minAllowed) return;
          var next = snapValue(
            { min: minAllowed, max: maxAllowed, step: 0.01 },
            states[idx].sz
          );
          var others = 0;
          for (var i = 0; i < n; i += 1) {
            if (i !== idx) others += states[i].sz;
          }
          var remain = n - next;
          var factor = others > 0.0001 ? remain / others : 1;
          states[idx].sz = next;
          for (var j = 0; j < n; j += 1) {
            if (j !== idx) states[j].sz = states[j].sz * factor;
          }
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function easeInOutCubic(t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function mixState(a, b, t) {
          return {
            slnt: lerp(a.slnt, b.slnt, t),
            wdth: lerp(a.wdth, b.wdth, t),
            wght: lerp(a.wght, b.wght, t),
            cntr: lerp(a.cntr, b.cntr, t),
            sz: lerp(a.sz, b.sz, t),
          };
        }

        function mixStep(fromStates, toStates, line, t) {
          var out = [];
          for (var i = 0; i < fromStates.length; i += 1) {
            if (i === line) {
              out.push(mixState(fromStates[i], toStates[i], t));
            } else {
              out.push({
                slnt: fromStates[i].slnt,
                wdth: fromStates[i].wdth,
                wght: fromStates[i].wght,
                cntr: fromStates[i].cntr,
                sz: lerp(fromStates[i].sz, toStates[i].sz, t),
              });
            }
          }
          return out;
        }

        function makePlan(fromStates) {
          var n = fromStates.length;
          var order = [];
          for (var i = 0; i < n; i += 1) order.push(i);
          order = shuffle(order);
          if (plan && plan.order.length && order[0] === plan.order[plan.order.length - 1] && n > 1) {
            order.push(order.shift());
          }
          var states = cloneStates(fromStates);
          var steps = [];
          for (var s = 0; s < order.length; s += 1) {
            var idx = order[s];
            states[idx] = randomState(states[idx]);
            randomizeSizes(states, idx);
            steps.push({
              states: cloneStates(states),
              line: idx,
            });
          }
          return {
            from: cloneStates(fromStates),
            order: order,
            steps: steps,
          };
        }

        function applyStates(states, changed) {
          var fs = Number(els.fs.value) || 260;
          var lh = Number(els.lh.value) || 1.06;
          for (var i = 0; i < numEls.length; i += 1) {
            if (!states[i]) continue;
            var s = states[i];
            var sz = s.sz > 0 ? s.sz : 1;
            numEls[i].style.fontVariationSettings = vfString(s);
            numEls[i].style.fontSize = fs * sz + "px";
            numEls[i].style.height = fs * sz * lh + "px";
          }
          if (!nowReadout) return;
          if (changed == null || changed < 0) {
            nowReadout.textContent = "hold";
            return;
          }
          var label = numEls[changed] ? numEls[changed].textContent : String(changed + 1);
          var cur = states[changed];
          nowReadout.textContent =
            label +
            " · wght " +
            Math.round(cur.wght) +
            " · wdth " +
            Math.round(cur.wdth) +
            " · CNTR " +
            Math.round(cur.cntr) +
            " · " +
            cur.sz.toFixed(2) +
            "×";
        }

        function cycleMs(n) {
          var move = Math.max(80, Number(els.move.value) || 900);
          var hold0 = Math.max(0, Number(els.hold0.value) || 0);
          var hold1 = Math.max(0, Number(els.hold1.value) || 0);
          return hold0 + n * move + hold1;
        }

        function sample(local, n, move, hold0) {
          if (local < hold0) {
            return { states: plan.from, changed: -1 };
          }
          var t = local - hold0;
          if (t >= n * move) {
            var last = plan.steps[n - 1];
            return { states: last.states, changed: last.line };
          }
          var i = Math.min(n - 1, Math.floor(t / move));
          var u = easeInOutCubic((t - i * move) / move);
          var fromStates = i === 0 ? plan.from : plan.steps[i - 1].states;
          var toStep = plan.steps[i];
          var line = toStep.line;
          var states = mixStep(fromStates, toStep.states, line, u);
          return { states: states, changed: line };
        }

        function applyElapsed(elapsed) {
          var n = numEls.length || 1;
          var move = Math.max(80, Number(els.move.value) || 900);
          var hold0 = Math.max(0, Number(els.hold0.value) || 0);
          var total = cycleMs(n);
          if (total <= 0) total = 1;
          if (elapsed < 0) elapsed = 0;
          var ci = Math.floor(elapsed / total);
          var local = elapsed - ci * total;

          if (ci !== cycleIndex || !plan || plan.from.length !== n) {
            var from =
              plan && plan.steps.length && plan.from.length === n
                ? plan.steps[plan.steps.length - 1].states
                : startStates(n);
            if (ci === 0 || !plan || plan.from.length !== n) from = startStates(n);
            plan = makePlan(from);
            cycleIndex = ci;
          }

          var next = sample(local, n, move, hold0);
          applyStates(next.states, next.changed);
        }

        function frame(now) {
          applyElapsed(now - t0);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function durationMs() {
          return Math.max(1, cycleMs(numEls.length || 1));
        }

        function stopPlayback() {
          playing = false;
          cancelAnimationFrame(raf);
          raf = 0;
        }

        function startPlayback() {
          playing = true;
          restart();
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        }

        function updateHead() {
          var lines = parseLines(els.tx.value);
          var spans = kfHead.querySelectorAll("span");
          for (var i = 0; i < LINE_COUNT; i += 1) {
            if (!spans[i + 1]) continue;
            spans[i + 1].textContent = lines[i] != null && lines[i] !== "" ? lines[i] : String(i + 1);
          }
        }

        function buildLockup(text) {
          lockup.innerHTML = "";
          numEls = [];
          parseLines(text).forEach(function (line) {
            var el = document.createElement("div");
            el.className = "num";
            el.textContent = line;
            lockup.appendChild(el);
            numEls.push(el);
          });
          updateHead();
        }

        function restart() {
          t0 = performance.now();
          cycleIndex = -1;
          plan = null;
          applyStates(startStates(numEls.length), -1);
        }

        function fmt(key, v) {
          if (COLOR_KEYS[key]) return String(v).toLowerCase();
          if (key === "tx") return String(v);
          if (key === "fs" || key === "oy") return Math.round(Number(v)) + "px";
          if (key === "lh" || key === "amp") return Number(v).toFixed(2);
          return Math.round(Number(v)) + "ms";
        }

        function applyVars() {
          root.style.setProperty("--bg", els.bg.value);
          root.style.setProperty("--fg", els.fg.value);
          root.style.setProperty("--fs", String(els.fs.value));
          root.style.setProperty("--lh", String(els.lh.value));
          root.style.setProperty("--oy", String(els.oy.value));
        }

        function paintVals() {
          Object.keys(vals).forEach(function (key) {
            if (!vals[key] || !els[key]) return;
            vals[key].textContent = fmt(key, els[key].value);
          });
        }

        function save() {
          var data = {};
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            data[key] = els[key].value;
          });
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(data));
          } catch (e) {}
        }

        function loadSaved() {
          var raw = null;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {}
          if (!raw) return;
          var data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            return;
          }
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key] || data[key] == null) return;
            els[key].value = data[key];
          });
        }

        function reset() {
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            els[key].value = DEFAULTS[key];
          });
          try {
            localStorage.removeItem(LS_KEY);
          } catch (e) {}
          buildLockup(els.tx.value);
          applyVars();
          paintVals();
          restart();
          if (window.ArtboardView && window.ArtboardView.reset) {
            window.ArtboardView.reset();
          }
        }

        Object.keys(els).forEach(function (key) {
          if (!els[key]) return;
          els[key].addEventListener("input", function () {
            if (key === "tx") buildLockup(els.tx.value);
            applyVars();
            paintVals();
            save();
            if (key === "tx" || START_KEYS[key]) restart();
          });
        });

        document.getElementById("resetBtn").addEventListener("click", reset);
        document.getElementById("replayBtn").addEventListener("click", restart);

        loadSaved();
        buildLockup(els.tx.value);
        applyVars();
        paintVals();
        restart();
        raf = requestAnimationFrame(frame);

        window.AnimatorExport = {
          stage: document.getElementById("stage"),
          filename: "white-circled.mp4",
          durationMs: durationMs,
          seek: applyElapsed,
          stop: stopPlayback,
          start: startPlayback,
        };
      })();
    </script>
    <script type="module" src="../../web-export.js?v=5"></script>
  </body>
</html>
