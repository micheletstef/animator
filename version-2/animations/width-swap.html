<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>width swap</title>
    <style>
      @font-face {
        font-family: "IkarusPlusVariable";
        src: url("../../fonts/ABCIkarusPlusVariable.ttf") format("truetype-variations");
        font-weight: 100 1000;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: light;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffffff;
        --bg-image: linear-gradient(
          to bottom,
          #2c2839 0%,
          #2a2f45 8%,
          #263957 20%,
          #1f4166 25%,
          #144a76 30%,
          #085488 35%,
          #01609a 40%,
          #0178b0 45%,
          #0091c4 50%,
          #16a9d5 55%,
          #58bdd9 60%,
          #a1d2e1 65%,
          #dbe5e7 70%,
          #eaeceb 80%,
          #e7e8e3 100%
        );
        --fg: #000000;
        --pad-t: 72;
        --pad-r: 56;
        --pad-b: 72;
        --pad-l: 56;
        --fs: 720;
        --lh: 0.82;
        --l1s: 0.84;
        --tracking: -0.04;
        --oy: 0;
        --slnt: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d3d3d3;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #1f1f1f;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background-color: var(--bg);
        background-image: var(--bg-image);
        background-repeat: no-repeat;
        background-size: 100% 100%;
        color: var(--fg);
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        font-family: "IkarusPlusVariable", sans-serif;
        font-synthesis: none;
        font-feature-settings: "liga" 1, "kern" 1;
        pointer-events: none;
      }

      .lockup {
        position: absolute;
        top: calc(var(--pad-t) * 1px);
        right: calc(var(--pad-r) * 1px);
        bottom: calc(var(--pad-b) * 1px);
        left: calc(var(--pad-l) * 1px);
        display: flex;
        align-items: center;
        justify-content: center;
        transform: translateY(calc(var(--oy) * 1px));
      }

      .fit {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: center;
        width: 100%;
      }

      .line {
        display: flex;
        flex-direction: row;
        align-items: baseline;
        width: 100%;
        font-size: calc(var(--fs) * 1px);
        line-height: var(--lh);
        letter-spacing: calc(var(--tracking) * 1em);
        white-space: nowrap;
        overflow: visible;
        font-synthesis: none;
        gap: 0;
      }

      .line.is-top {
        font-size: calc(var(--fs) * var(--l1s) * 1px);
        line-height: 0.92;
      }

      .unit {
        display: block;
        flex: 0 0 auto;
        overflow: visible;
        line-height: inherit;
        letter-spacing: inherit;
        white-space: nowrap;
        font-kerning: none;
      }

      .unit + .unit {
        margin-left: 0.14em;
      }

      .unit:not(:last-child) .inner {
        margin-right: calc(var(--tracking) * -1em);
      }

      .inner {
        display: block;
        width: max-content;
        line-height: inherit;
        letter-spacing: inherit;
        white-space: nowrap;
        transform-origin: 0 50%;
        font-synthesis: none;
      }

      .probe {
        position: absolute;
        left: -9999px;
        top: 0;
        visibility: hidden;
        pointer-events: none;
        white-space: nowrap;
        font-family: "IkarusPlusVariable", sans-serif;
        font-synthesis: none;
        font-feature-settings: "liga" 1, "kern" 1;
        font-kerning: none;
      }

      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }

      .panel .hint {
        margin: 0 0 14px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .panel .group {
        margin-bottom: 18px;
      }

      .panel .group-title {
        text-transform: lowercase;
        color: #6a6a6a;
        margin: 0 0 8px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        justify-self: start;
        accent-color: #fff;
        cursor: pointer;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 2px;
      }

      .row input[type="text"] {
        grid-column: 2 / 4;
        width: 100%;
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #111;
        color: #e9e9e9;
        font: inherit;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .now {
        margin: 0 0 10px 0;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      .panel .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .panel button {
        flex: 1;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        padding: 6px 8px;
        font: inherit;
        text-transform: lowercase;
        cursor: pointer;
        border-radius: 4px;
      }

      .panel button:hover {
        border-color: #555;
        color: #fff;
      }
    </style>
    <link rel="stylesheet" href="../../animation-chrome.css?v=3" />
  </head>
  <body>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-outer">
        <div class="stage" id="stage" aria-label="width swap">
          <div class="lockup" id="lockup">
            <div class="fit" id="fit"></div>
          </div>
        </div>
      </div>
    </div>
    <aside class="panel" aria-label="Settings">
      <h2>settings</h2>
      <p class="hint">
        scroll to zoom · drag to pan · double-click to fit · 1080 × 1440
      </p>

      <div class="group">
        <p class="group-title">color</p>
        <div class="row">
          <label for="grad">gradient</label>
          <input id="grad" type="checkbox" checked />
          <span class="val" id="gradVal">on</span>
        </div>
        <div class="row">
          <label for="bg">bg</label>
          <input id="bg" type="color" value="#ffffff" />
          <span class="val" id="bgVal">#ffffff</span>
        </div>
        <div class="row">
          <label for="fg">text</label>
          <input id="fg" type="color" value="#000000" />
          <span class="val" id="fgVal">#000000</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">copy · first glyph vs rest</p>
        <div class="row">
          <label for="l1">line 1</label>
          <input id="l1" type="text" value="R41" spellcheck="false" autocomplete="off" />
        </div>
        <div class="row">
          <label for="l2">line 2</label>
          <input id="l2" type="text" value="X8" spellcheck="false" autocomplete="off" />
        </div>
      </div>

      <div class="group">
        <p class="group-title">type</p>
        <div class="row">
          <label for="lh">leading</label>
          <input id="lh" type="range" min="0.7" max="1.2" step="0.01" value="0.82" />
          <span class="val" id="lhVal">0.82</span>
        </div>
        <div class="row">
          <label for="oy">y</label>
          <input id="oy" type="range" min="-360" max="360" step="1" value="0" />
          <span class="val" id="oyVal">0px</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">motion · ping-pong accordion</p>
        <p class="now" id="nowReadout">R condensed · 41 extended</p>
        <div class="row">
          <label for="move">move</label>
          <input id="move" type="range" min="200" max="4000" step="20" value="1800" />
          <span class="val" id="moveVal">1800ms</span>
        </div>
        <div class="row">
          <label for="hold">hold</label>
          <input id="hold" type="range" min="0" max="3000" step="50" value="700" />
          <span class="val" id="holdVal">700ms</span>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="resetBtn">reset</button>
        <button type="button" id="replayBtn">replay</button>
      </div>
    </aside>

    <span class="probe" id="probe" aria-hidden="true"></span>

    <script src="artboard-view.js?v=2"></script>
    <script>
      (function () {
        var GRADIENT =
          "linear-gradient(to bottom, #2c2839 0%, #2a2f45 8%, #263957 20%, #1f4166 25%, #144a76 30%, #085488 35%, #01609a 40%, #0178b0 45%, #0091c4 50%, #16a9d5 55%, #58bdd9 60%, #a1d2e1 65%, #dbe5e7 70%, #eaeceb 80%, #e7e8e3 100%)";
        var LS_KEY = "animator:v2:width-swap:settings:v6";
        var STAGE_W = 1080;
        var WDTH_STEP = 1;
        var FS = 720;
        var TRACK = -0.04;
        var WDTH_LO = 65;
        var WDTH_HI = 130;
        var SLNT = 0;
        var L1_SCALE = 0.84;
        var LINE_WGHT = [700, 1000];
        var LINE_CNTR = [0, 100];

        var root = document.documentElement;
        var fitEl = document.getElementById("fit");
        var probe = document.getElementById("probe");
        var nowReadout = document.getElementById("nowReadout");
        var lines = [];
        var sampleCache = {};
        var t0 = 0;

        var DEFAULTS = {
          bg: "#ffffff",
          grad: "1",
          fg: "#000000",
          l1: "R41",
          l2: "X8",
          lh: 0.82,
          oy: 0,
          move: 1800,
          hold: 700,
        };

        var COLOR_KEYS = { bg: 1, fg: 1 };
        var TEXT_KEYS = { l1: 1, l2: 1 };
        var CHECK_KEYS = { grad: 1 };

        var els = {};
        var vals = {
          bg: document.getElementById("bgVal"),
          grad: document.getElementById("gradVal"),
          fg: document.getElementById("fgVal"),
          lh: document.getElementById("lhVal"),
          oy: document.getElementById("oyVal"),
          move: document.getElementById("moveVal"),
          hold: document.getElementById("holdVal"),
        };

        Object.keys(DEFAULTS).forEach(function (key) {
          els[key] = document.getElementById(key);
        });

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function easeInOutCubic(t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function vfString(wght, wdth, cntr, slnt) {
          return (
            '"wght" ' +
            wght +
            ', "wdth" ' +
            wdth +
            ', "CNTR" ' +
            cntr +
            ', "slnt" ' +
            slnt
          );
        }

        function splitLine(raw) {
          var text = String(raw || "");
          if (!text) return ["", ""];
          return [text.charAt(0), text.slice(1)];
        }

        function wdthRange() {
          return { lo: WDTH_LO, hi: WDTH_HI };
        }

        function targetWidth() {
          var cs = getComputedStyle(root);
          var padL = Number(cs.getPropertyValue("--pad-l")) || 56;
          var padR = Number(cs.getPropertyValue("--pad-r")) || 56;
          var target = STAGE_W - padL - padR;
          return target < 40 ? 40 : target;
        }

        function lineWeight(index) {
          return LINE_WGHT[index] || 700;
        }

        function lineContrast(index) {
          return LINE_CNTR[index] || 0;
        }

        function measureWidth(text, fs, vf) {
          probe.style.fontSize = fs + "px";
          probe.style.letterSpacing = TRACK + "em";
          probe.style.fontVariationSettings = vf;
          probe.textContent = text || "";
          return probe.getBoundingClientRect().width;
        }

        function getSamples(text, wght, cntr, slnt, fs) {
          var range = wdthRange();
          var key = text + "|" + wght + "|" + cntr + "|" + slnt + "|" + fs;
          if (sampleCache[key]) return sampleCache[key];
          var wdths = [];
          var widths = [];
          for (var w = range.lo; w <= range.hi; w += WDTH_STEP) {
            wdths.push(w);
            widths.push(measureWidth(text, fs, vfString(wght, w, cntr, slnt)));
          }
          if (wdths[wdths.length - 1] !== range.hi) {
            wdths.push(range.hi);
            widths.push(measureWidth(text, fs, vfString(wght, range.hi, cntr, slnt)));
          }
          sampleCache[key] = { wdths: wdths, widths: widths };
          return sampleCache[key];
        }

        function lookupWdth(samples, targetW) {
          var wdths = samples.wdths;
          var widths = samples.widths;
          var n = widths.length;
          if (!n) return { wdth: wdthRange().lo, width: 0 };
          if (targetW <= widths[0]) {
            return { wdth: wdths[0], width: widths[0] };
          }
          if (targetW >= widths[n - 1]) {
            return { wdth: wdths[n - 1], width: widths[n - 1] };
          }
          for (var i = 0; i < n - 1; i++) {
            if (targetW <= widths[i + 1]) {
              var span = widths[i + 1] - widths[i];
              var u = span <= 0 ? 0 : (targetW - widths[i]) / span;
              return {
                wdth: lerp(wdths[i], wdths[i + 1], u),
                width: lerp(widths[i], widths[i + 1], u),
              };
            }
          }
          return { wdth: wdths[n - 1], width: widths[n - 1] };
        }

        function widthAt(samples, wdth) {
          var wdths = samples.wdths;
          var widths = samples.widths;
          if (!wdths.length) return 0;
          if (wdth <= wdths[0]) return widths[0];
          if (wdth >= wdths[wdths.length - 1]) return widths[widths.length - 1];
          for (var i = 0; i < wdths.length - 1; i++) {
            if (wdth <= wdths[i + 1]) {
              var span = wdths[i + 1] - wdths[i];
              var u = span <= 0 ? 0 : (wdth - wdths[i]) / span;
              return lerp(widths[i], widths[i + 1], u);
            }
          }
          return widths[widths.length - 1];
        }

        function solveFit(samples, target) {
          if (!samples || target <= 0) {
            return { wdth: wdthRange().lo, sx: 1 };
          }
          var found = lookupWdth(samples, target);
          var sx = found.width > 0.5 ? target / found.width : 1;
          return { wdth: found.wdth, sx: sx };
        }

        function prepareUnits() {
          var slnt = SLNT;
          var fs = FS;
          var minWdth = WDTH_LO;
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            var lineFs = i === 0 ? fs * L1_SCALE : fs;
            line.wght = lineWeight(i);
            line.cntr = lineContrast(i);
            for (var j = 0; j < line.units.length; j++) {
              var unit = line.units[j];
              unit.samples = getSamples(
                unit.text,
                line.wght,
                line.cntr,
                slnt,
                lineFs
              );
              unit.minW = widthAt(unit.samples, minWdth);
              unit.inner.style.fontWeight = String(Math.round(line.wght));
            }
          }
        }

        function applyUnitAtWdth(unit, line, wdth, pct, sx) {
          unit.el.style.flex = "0 0 " + pct + "%";
          unit.el.style.width = pct + "%";
          unit.inner.style.fontVariationSettings = vfString(
            line.wght,
            wdth,
            line.cntr,
            SLNT
          );
          unit.inner.style.transform = "scaleX(" + sx + ")";
          return { wdth: wdth, pct: pct };
        }

        function applyUnit(unit, line, pct, target) {
          var boxW = target * (pct / 100);
          var fit = solveFit(unit.samples, boxW);
          return applyUnitAtWdth(unit, line, fit.wdth, pct, fit.sx);
        }

        function applyLine(line, t, target) {
          var units = line.units;
          if (!units.length) return [];
          if (units.length === 1) {
            return [applyUnit(units[0], line, 100, target)];
          }

          var a = units[0];
          var b = units[1];
          var lineTarget = target * (line.index === 0 ? 0.94 : 0.97);
          if (line.index === 0) {
            var range = wdthRange();
            var wdthA =
              a.from === "condensed"
                ? lerp(range.lo, range.hi, t)
                : lerp(range.hi, range.lo, t);
            var wdthB =
              b.from === "condensed"
                ? lerp(range.lo, range.hi, t)
                : lerp(range.hi, range.lo, t);
            var natA = Math.max(widthAt(a.samples, wdthA), 1);
            var natB = Math.max(widthAt(b.samples, wdthB), 1);
            var total = natA + natB;
            var sx = total > 0.5 ? lineTarget / total : 1;
            var pctA = (natA / total) * 100;
            return [
              applyUnitAtWdth(a, line, wdthA, pctA, sx),
              applyUnitAtWdth(b, line, wdthB, 100 - pctA, sx),
            ];
          }

          var minA = a.minW || 8;
          var minB = b.minW || 8;
          var floor = 8;
          if (minA < floor) minA = floor;
          if (minB < floor) minB = floor;
          if (minA + minB > lineTarget) {
            var scale = lineTarget / (minA + minB);
            minA *= scale;
            minB *= scale;
          }

          var span = lineTarget - minA - minB;
          var widthA =
            a.from === "condensed" ? minA + span * t : minA + span * (1 - t);
          var pctA = (widthA / lineTarget) * 100;
          var pctB = 100 - pctA;

          return [
            applyUnit(a, line, pctA, lineTarget),
            applyUnit(b, line, pctB, lineTarget),
          ];
        }

        function applyMix(t) {
          var target = targetWidth();
          var bits = [];
          for (var i = 0; i < lines.length; i++) {
            var states = applyLine(lines[i], t, target);
            for (var j = 0; j < states.length; j++) {
              bits.push(
                lines[i].units[j].label + " wdth " + Math.round(states[j].wdth)
              );
            }
          }
          nowReadout.textContent = bits.length ? bits.join(" · ") : "—";
        }

        function sample(elapsed) {
          var move = Math.max(80, Number(els.move.value) || 1800);
          var hold = Math.max(0, Number(els.hold.value) || 0);
          var half = hold + move;
          var total = Math.max(1, half * 2);
          var t = elapsed % total;
          if (t < half) {
            if (t < hold) return 0;
            return easeInOutCubic((t - hold) / move);
          }
          var back = t - half;
          if (back < hold) return 1;
          return 1 - easeInOutCubic((back - hold) / move);
        }

        function frame(now) {
          applyMix(sample(now - t0));
          requestAnimationFrame(frame);
        }

        function restart() {
          t0 = performance.now();
        }

        function readVal(key) {
          if (!els[key]) return DEFAULTS[key];
          if (CHECK_KEYS[key]) return els[key].checked ? "1" : "0";
          return els[key].value;
        }

        function writeVal(key, value) {
          if (!els[key]) return;
          if (CHECK_KEYS[key]) {
            els[key].checked = value === true || value === 1 || value === "1" || value === "on";
            return;
          }
          els[key].value = value;
        }

        function fmt(key, v) {
          if (CHECK_KEYS[key]) return v === "1" || v === true || v === "on" ? "on" : "off";
          if (COLOR_KEYS[key]) return String(v).toLowerCase();
          if (TEXT_KEYS[key]) return String(v);
          if (key === "fs" || key === "oy") return Math.round(Number(v)) + "px";
          if (key === "lh") return Number(v).toFixed(2);
          if (key === "move" || key === "hold") return Math.round(Number(v)) + "ms";
          return String(Math.round(Number(v)));
        }

        function applyVars() {
          root.style.setProperty("--bg", els.bg.value);
          root.style.setProperty("--bg-image", els.grad.checked ? GRADIENT : "none");
          root.style.setProperty("--fg", els.fg.value);
          root.style.setProperty("--fs", String(FS));
          root.style.setProperty("--lh", String(els.lh.value));
          root.style.setProperty("--tracking", String(TRACK));
          root.style.setProperty("--oy", String(els.oy.value));
          root.style.setProperty("--slnt", String(SLNT));
          root.style.setProperty("--l1s", String(L1_SCALE));
        }

        function paintVals() {
          Object.keys(vals).forEach(function (key) {
            if (!vals[key] || !els[key]) return;
            vals[key].textContent = fmt(key, readVal(key));
          });
        }

        function save() {
          var data = {};
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            data[key] = readVal(key);
          });
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(data));
          } catch (e) {}
        }

        function loadSaved() {
          var raw = null;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {}
          if (!raw) return;
          var data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            return;
          }
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key] || data[key] == null) return;
            writeVal(key, data[key]);
          });
        }

        function buildLockup() {
          fitEl.innerHTML = "";
          lines = [];
          sampleCache = {};
          var rows = [
            { text: els.l1.value, firstFrom: "condensed" },
            { text: els.l2.value, firstFrom: "extended" },
          ];
          rows.forEach(function (row, rowIndex) {
            var parts = splitLine(row.text);
            var lineEl = document.createElement("div");
            lineEl.className = "line";
            if (rowIndex === 0) lineEl.classList.add("is-top");
            var units = [];
            parts.forEach(function (text, i) {
              if (!text) return;
              var unitEl = document.createElement("span");
              unitEl.className = "unit";
              var inner = document.createElement("span");
              inner.className = "inner";
              inner.textContent = text;
              unitEl.appendChild(inner);
              lineEl.appendChild(unitEl);
              units.push({
                el: unitEl,
                inner: inner,
                text: text,
                from:
                  i === 0
                    ? row.firstFrom
                    : row.firstFrom === "condensed"
                      ? "extended"
                      : "condensed",
                label: text,
              });
            });
            if (!units.length) return;
            fitEl.appendChild(lineEl);
            lines.push({
              el: lineEl,
              units: units,
              index: rowIndex,
              wght: lineWeight(rowIndex),
              cntr: lineContrast(rowIndex),
            });
          });
          prepareUnits();
        }

        function reset() {
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            writeVal(key, DEFAULTS[key]);
          });
          try {
            localStorage.removeItem(LS_KEY);
          } catch (e) {}
          applyVars();
          paintVals();
          buildLockup();
          restart();
          if (window.ArtboardView && window.ArtboardView.reset) {
            window.ArtboardView.reset();
          }
        }

        Object.keys(els).forEach(function (key) {
          if (!els[key]) return;
          els[key].addEventListener("input", function () {
            applyVars();
            paintVals();
            if (key === "l1" || key === "l2") buildLockup();
            save();
          });
        });

        document.getElementById("resetBtn").addEventListener("click", reset);
        document.getElementById("replayBtn").addEventListener("click", restart);

        loadSaved();
        applyVars();
        paintVals();
        buildLockup();
        restart();

        var start = function () {
          prepareUnits();
          requestAnimationFrame(frame);
        };
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(start);
        } else {
          start();
        }
      })();
    </script>
  </body>
</html>
