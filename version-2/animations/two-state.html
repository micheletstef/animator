<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>two state</title>
    <style>
      @font-face {
        font-family: "IkarusPlusVariable";
        src: url("../../fonts/ABCIkarusPlusVariable.ttf") format("truetype-variations");
        font-weight: 100 1000;
        font-stretch: 65% 130%;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: light;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffcfcf;
        --fg: #300000;
        --pad-t: 72;
        --pad-r: 64;
        --pad-b: 72;
        --pad-l: 64;
        --fs: 410;
        --lh: 0.88;
        --tracking: -0.02;
        --oy: 0;
        --lock-align: center;
        --lock-text: center;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d3d3d3;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #1f1f1f;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        box-shadow: none;
        font-family: "IkarusPlusVariable", sans-serif;
        font-synthesis: none;
        font-feature-settings: "liga" 0, "kern" 1;
        pointer-events: none;
      }

      .lockup {
        position: absolute;
        top: var(--guide-t, calc(var(--pad-t) * 1px));
        right: var(--guide-r, calc(var(--pad-r) * 1px));
        bottom: var(--guide-b, calc(var(--pad-b) * 1px));
        left: var(--guide-l, calc(var(--pad-l) * 1px));
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: var(--lock-align);
        text-align: var(--lock-text);
        overflow: visible;
        transform: translateY(calc(var(--oy) * 1px));
      }

      .line {
        display: block;
        width: 100%;
        height: calc(var(--fs) * var(--lh) * 1px);
        font-size: calc(var(--fs) * 1px);
        line-height: var(--lh);
        letter-spacing: calc(var(--tracking) * 1em);
        white-space: nowrap;
        font-kerning: none;
      }

      .ch {
        display: inline;
        font-synthesis: none;
        font-kerning: none;
      }

      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }

      .panel .hint {
        margin: 0 0 14px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .panel .group {
        margin-bottom: 18px;
      }

      .panel .group-title {
        text-transform: lowercase;
        color: #6a6a6a;
        margin: 0 0 8px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 2px;
      }

      .row input[type="text"],
      .row textarea,
      .row select {
        grid-column: 2 / 4;
        width: 100%;
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #111;
        color: #e9e9e9;
        font: inherit;
      }

      .row textarea {
        min-height: 88px;
        resize: vertical;
        line-height: 1.25;
        white-space: pre;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .now {
        margin: 0 0 10px 0;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      .glyph-pad {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 4px;
      }

      .glyph-line {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }

      .glyph-chip {
        flex: 0 0 auto;
        min-width: 28px;
        height: 28px;
        padding: 0 7px;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        color: #cfcfcf;
        font-family: "IkarusPlusVariable", sans-serif;
        font-size: 15px;
        line-height: 26px;
        font-synthesis: none;
        font-variation-settings: "wght" 200, "wdth" 100, "CNTR" 100, "slnt" 0;
        text-transform: none;
        cursor: pointer;
      }

      .glyph-chip.is-thick {
        background: #1f1f1f;
        border-color: #1f1f1f;
        color: #f3f3f3;
        font-variation-settings: "wght" 800, "wdth" 100, "CNTR" 100, "slnt" 0;
      }
    </style>
    <link rel="stylesheet" href="../../animation-chrome.css?v=38" />
    <style>
      .glyph-chip {
        border-color: rgba(31, 31, 31, 0.28);
        background: #fff;
        color: #1f1f1f;
        font-variation-settings: "wght" 200, "wdth" 100, "CNTR" 100, "slnt" 0;
      }

      .glyph-chip:hover {
        border-color: #1f1f1f;
      }

      .glyph-chip.is-thick {
        background: #1f1f1f;
        border-color: #1f1f1f;
        color: #d3d3d3;
        font-variation-settings: "wght" 800, "wdth" 100, "CNTR" 100, "slnt" 0;
      }

      .glyph-chip.is-thick:hover {
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-outer">
        <div class="stage" id="stage" aria-label="two state">
          <div class="lockup" id="lockup"></div>
        </div>
      </div>
    </div>
    <aside class="panel" aria-label="Settings">
      <h2>settings</h2>
      <p class="hint">
        scroll to zoom · drag to pan · double-click to fit · 1080 × 1440
      </p>

      <div class="group">
        <p class="group-title">color</p>
        <div class="row">
          <label for="bg">bg</label>
          <input id="bg" type="color" value="#ffcfcf" />
          <span class="val" id="bgVal">#ffcfcf</span>
        </div>
        <div class="row">
          <label for="fg">text</label>
          <input id="fg" type="color" value="#300000" />
          <span class="val" id="fgVal">#300000</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">content</p>
        <div class="row">
          <label for="tx">text</label>
          <textarea id="tx" spellcheck="false" autocomplete="off">.35
Mm
XT°5</textarea>
        </div>
      </div>

      <div class="group">
        <p class="group-title">type</p>
        <div class="row">
          <label for="align">align</label>
          <select id="align">
            <option value="left">left</option>
            <option value="center" selected>center</option>
            <option value="right">right</option>
          </select>
        </div>
        <div class="row">
          <label for="fs">size</label>
          <input id="fs" type="range" min="80" max="520" step="1" value="410" />
          <span class="val" id="fsVal">410px</span>
        </div>
        <div class="row">
          <label for="lh">leading</label>
          <input id="lh" type="range" min="0.7" max="1.4" step="0.01" value="0.88" />
          <span class="val" id="lhVal">0.88</span>
        </div>
        <div class="row">
          <label for="tr">track</label>
          <input id="tr" type="range" min="-0.12" max="0.12" step="0.005" value="-0.02" />
          <span class="val" id="trVal">-0.02</span>
        </div>
        <div class="row">
          <label for="oy">y</label>
          <input id="oy" type="range" min="-360" max="360" step="1" value="0" />
          <span class="val" id="oyVal">0px</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">state 1</p>
        <div class="row">
          <label for="w1">wght</label>
          <input id="w1" type="range" min="200" max="1000" step="1" value="920" />
          <span class="val" id="w1Val">920</span>
        </div>
        <div class="row">
          <label for="d1">wdth</label>
          <input id="d1" type="range" min="65" max="130" step="1" value="100" />
          <span class="val" id="d1Val">100</span>
        </div>
        <div class="row">
          <label for="c1">CNTR</label>
          <input id="c1" type="range" min="0" max="100" step="1" value="100" />
          <span class="val" id="c1Val">100</span>
        </div>
        <div class="row">
          <label for="s1">slnt</label>
          <input id="s1" type="range" min="-12" max="0" step="0.25" value="0" />
          <span class="val" id="s1Val">0</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">state 2</p>
        <div class="row">
          <label for="w2">wght</label>
          <input id="w2" type="range" min="200" max="1000" step="1" value="200" />
          <span class="val" id="w2Val">200</span>
        </div>
        <div class="row">
          <label for="d2">wdth</label>
          <input id="d2" type="range" min="65" max="130" step="1" value="100" />
          <span class="val" id="d2Val">100</span>
        </div>
        <div class="row">
          <label for="c2">CNTR</label>
          <input id="c2" type="range" min="0" max="100" step="1" value="100" />
          <span class="val" id="c2Val">100</span>
        </div>
        <div class="row">
          <label for="s2">slnt</label>
          <input id="s2" type="range" min="-12" max="0" step="0.25" value="0" />
          <span class="val" id="s2Val">0</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">glyphs · state 1 mix</p>
        <p class="hint">dark = uses state 1 wght · light = stays at state 2 wght</p>
        <div class="glyph-pad" id="glyphPad"></div>
      </div>

      <div class="group">
        <p class="group-title">motion</p>
        <p class="now" id="nowReadout">state 1</p>
        <div class="row">
          <label for="cy">cycle</label>
          <input id="cy" type="range" min="800" max="12000" step="100" value="2800" />
          <span class="val" id="cyVal">2.8s</span>
        </div>
        <div class="row">
          <label for="hd">hold</label>
          <input id="hd" type="range" min="0" max="2400" step="50" value="700" />
          <span class="val" id="hdVal">700ms</span>
        </div>
      </div>
    </aside>

    <script src="artboard-view.js?v=27"></script>
    <script>
      (function () {
        var DEFAULT_TEXT = ".35\nMm\nXT°5";
        var LS_KEY = "animator:v2:two-state:settings:v1";
        var root = document.documentElement;
        var lockup = document.getElementById("lockup");
        var glyphPad = document.getElementById("glyphPad");
        var nowReadout = document.getElementById("nowReadout");
        var glyphs = [];
        var mix = [];
        var lastText = DEFAULT_TEXT;

        var DEFAULTS = {
          bg: "#ffcfcf",
          fg: "#300000",
          tx: DEFAULT_TEXT,
          align: "center",
          fs: 410,
          lh: 0.88,
          tr: -0.02,
          oy: 0,
          w1: 920,
          d1: 100,
          c1: 100,
          s1: 0,
          w2: 200,
          d2: 100,
          c2: 100,
          s2: 0,
          cy: 2800,
          hd: 700,
        };

        var COLOR_KEYS = { bg: 1, fg: 1 };
        var TEXT_KEYS = { tx: 1, align: 1 };

        var els = {};
        var vals = {
          bg: document.getElementById("bgVal"),
          fg: document.getElementById("fgVal"),
          fs: document.getElementById("fsVal"),
          lh: document.getElementById("lhVal"),
          tr: document.getElementById("trVal"),
          oy: document.getElementById("oyVal"),
          w1: document.getElementById("w1Val"),
          d1: document.getElementById("d1Val"),
          c1: document.getElementById("c1Val"),
          s1: document.getElementById("s1Val"),
          w2: document.getElementById("w2Val"),
          d2: document.getElementById("d2Val"),
          c2: document.getElementById("c2Val"),
          s2: document.getElementById("s2Val"),
          cy: document.getElementById("cyVal"),
          hd: document.getElementById("hdVal"),
        };

        Object.keys(DEFAULTS).forEach(function (key) {
          els[key] = document.getElementById(key);
        });

        var t0 = 0;
        var raf = 0;
        var playing = true;
        var lastPhase = 0;

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function ease(t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          return 0.5 * (1 - Math.cos(Math.PI * t));
        }

        function num(key, fallback) {
          var n = els[key] ? parseFloat(els[key].value) : fallback;
          return isFinite(n) ? n : fallback;
        }

        function parseLines(raw) {
          return String(raw == null ? "" : raw)
            .replace(/\r\n/g, "\n")
            .split("\n")
            .map(function (s) {
              return s.replace(/\s+$/, "");
            })
            .filter(function (s) {
              return s.length > 0;
            });
        }

        function charsOf(line) {
          return Array.from(String(line || ""));
        }

        function flattenText(raw) {
          var lines = parseLines(raw);
          var out = [];
          var i;
          var j;
          var chars;
          for (i = 0; i < lines.length; i++) {
            chars = charsOf(lines[i]);
            for (j = 0; j < chars.length; j++) {
              out.push({ ch: chars[j], line: i });
            }
          }
          return out;
        }

        function remapMix(nextText, prevText, prevMix) {
          var next = flattenText(nextText);
          var prev = flattenText(prevText);
          var out = [];
          var i;
          for (i = 0; i < next.length; i++) {
            if (
              prev[i] &&
              prev[i].ch === next[i].ch &&
              prevMix &&
              prevMix[i] != null
            ) {
              out[i] = prevMix[i] ? 1 : 0;
            } else {
              out[i] = 1;
            }
          }
          return out;
        }

        function vfString(wght, wdth, cntr, slnt) {
          return (
            '"wght" ' +
            wght.toFixed(1) +
            ', "wdth" ' +
            wdth.toFixed(1) +
            ', "CNTR" ' +
            cntr.toFixed(1) +
            ', "slnt" ' +
            slnt.toFixed(2)
          );
        }

        function applyAlign() {
          var a = (els.align && els.align.value) || "center";
          if (a === "left") {
            root.style.setProperty("--lock-align", "flex-start");
            root.style.setProperty("--lock-text", "left");
          } else if (a === "right") {
            root.style.setProperty("--lock-align", "flex-end");
            root.style.setProperty("--lock-text", "right");
          } else {
            root.style.setProperty("--lock-align", "center");
            root.style.setProperty("--lock-text", "center");
          }
        }

        function applyVars() {
          root.style.setProperty("--bg", els.bg.value);
          root.style.setProperty("--fg", els.fg.value);
          root.style.setProperty("--fs", String(num("fs", 410)));
          root.style.setProperty("--lh", String(num("lh", 0.88)));
          root.style.setProperty("--tracking", String(num("tr", -0.02)));
          root.style.setProperty("--oy", String(num("oy", 0)));
          applyAlign();
        }

        function formatMs(ms) {
          if (ms >= 1000) return (ms / 1000).toFixed(1) + "s";
          return Math.round(ms) + "ms";
        }

        function formatVal(key, v) {
          if (key === "bg" || key === "fg") return String(v).toLowerCase();
          if (key === "lh" || key === "tr") return Number(v).toFixed(2);
          if (key === "fs" || key === "oy") return Math.round(Number(v)) + "px";
          if (key === "cy" || key === "hd") return formatMs(Number(v));
          if (key === "s1" || key === "s2") {
            var s = Number(v);
            return Math.abs(s) < 0.001 ? "0" : String(s);
          }
          if (key === "w1" || key === "w2" || key === "d1" || key === "d2" || key === "c1" || key === "c2") {
            return String(Math.round(Number(v)));
          }
          return String(v);
        }

        function paintVals() {
          Object.keys(vals).forEach(function (key) {
            if (!vals[key] || !els[key]) return;
            vals[key].textContent = formatVal(key, els[key].value);
          });
        }

        function stateValues(which) {
          var p = which === 2 ? "2" : "1";
          return {
            wght: num("w" + p, which === 2 ? 200 : 920),
            wdth: num("d" + p, 100),
            cntr: num("c" + p, 100),
            slnt: num("s" + p, 0),
          };
        }

        function mixAt(p) {
          var a = stateValues(1);
          var b = stateValues(2);
          var t = ease(p);
          return {
            wght: lerp(a.wght, b.wght, t),
            wdth: lerp(a.wdth, b.wdth, t),
            cntr: lerp(a.cntr, b.cntr, t),
            slnt: lerp(a.slnt, b.slnt, t),
            t: t,
          };
        }

        function applyGlyph(g, mixed) {
          var s2 = stateValues(2);
          var wght = g.thick ? mixed.wght : s2.wght;
          g.el.style.fontVariationSettings = vfString(
            wght,
            mixed.wdth,
            mixed.cntr,
            mixed.slnt
          );
          g.el.style.fontWeight = String(Math.round(wght));
        }

        function applyMix(p) {
          var mixed = mixAt(p);
          var i;
          for (i = 0; i < glyphs.length; i++) {
            applyGlyph(glyphs[i], mixed);
          }
          if (nowReadout) {
            if (mixed.t <= 0.001) nowReadout.textContent = "state 1";
            else if (mixed.t >= 0.999) nowReadout.textContent = "state 2";
            else nowReadout.textContent = "mix " + mixed.t.toFixed(2);
          }
        }

        function buildChips() {
          if (!glyphPad) return;
          glyphPad.innerHTML = "";
          var lineEl = null;
          var lastLine = -1;
          var i;
          for (i = 0; i < glyphs.length; i++) {
            if (glyphs[i].ch === " ") continue;
            if (glyphs[i].line !== lastLine) {
              lineEl = document.createElement("div");
              lineEl.className = "glyph-line";
              glyphPad.appendChild(lineEl);
              lastLine = glyphs[i].line;
            }
            (function (index) {
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "glyph-chip" + (glyphs[index].thick ? " is-thick" : "");
              btn.textContent = glyphs[index].ch;
              btn.setAttribute(
                "aria-pressed",
                glyphs[index].thick ? "true" : "false"
              );
              btn.title = glyphs[index].thick
                ? "state 1 wght"
                : "stays at state 2 wght";
              btn.addEventListener("click", function () {
                glyphs[index].thick = !glyphs[index].thick;
                mix[index] = glyphs[index].thick ? 1 : 0;
                btn.classList.toggle("is-thick", glyphs[index].thick);
                btn.setAttribute(
                  "aria-pressed",
                  glyphs[index].thick ? "true" : "false"
                );
                btn.title = glyphs[index].thick
                  ? "state 1 wght"
                  : "stays at state 2 wght";
                applyMix(lastPhase);
                save();
              });
              lineEl.appendChild(btn);
            })(i);
          }
        }

        function buildLockup() {
          var text = els.tx ? els.tx.value : DEFAULT_TEXT;
          var lines = parseLines(text);
          mix = remapMix(text, lastText, mix);
          lastText = text;
          lockup.innerHTML = "";
          glyphs = [];
          var gi = 0;
          var i;
          var j;
          var chars;
          var lineEl;
          var span;
          for (i = 0; i < lines.length; i++) {
            lineEl = document.createElement("div");
            lineEl.className = "line";
            chars = charsOf(lines[i]);
            for (j = 0; j < chars.length; j++) {
              span = document.createElement("span");
              span.className = "ch";
              span.textContent = chars[j] === " " ? "\u00a0" : chars[j];
              lineEl.appendChild(span);
              glyphs.push({
                el: span,
                ch: chars[j],
                line: i,
                thick: mix[gi] ? true : false,
              });
              gi += 1;
            }
            lockup.appendChild(lineEl);
          }
          buildChips();
          applyMix(lastPhase);
        }

        function timing() {
          var cycle = Math.max(80, num("cy", 2800));
          var hold = Math.max(0, num("hd", 0));
          return {
            cycle: cycle,
            hold: hold,
            half: cycle / 2,
            total: cycle + 2 * hold,
          };
        }

        function durationMs() {
          return Math.max(1, timing().total);
        }

        function phaseFromElapsed(elapsed) {
          var t = timing();
          var x = ((elapsed % t.total) + t.total) % t.total;
          if (x < t.hold) return 0;
          if (x < t.hold + t.half) return (x - t.hold) / t.half;
          if (x < t.hold + t.half + t.hold) return 1;
          return 1 - (x - t.hold - t.half - t.hold) / t.half;
        }

        function applyElapsed(ms) {
          lastPhase = phaseFromElapsed(ms);
          applyMix(lastPhase);
        }

        function frame(now) {
          applyElapsed(now - t0);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function stopPlayback() {
          playing = false;
          cancelAnimationFrame(raf);
          raf = 0;
        }

        function startPlayback() {
          playing = true;
          t0 = performance.now();
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        }

        function restart() {
          t0 = performance.now();
          applyElapsed(0);
          cancelAnimationFrame(raf);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function save() {
          var data = {};
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            if (TEXT_KEYS[key] || COLOR_KEYS[key]) data[key] = els[key].value;
            else data[key] = parseFloat(els[key].value);
          });
          data.mix = mix.slice();
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(data));
          } catch (e) {}
        }

        function loadSaved() {
          var raw = null;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {}
          if (!raw) return;
          var data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            return;
          }
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key] || data[key] == null) return;
            els[key].value = data[key];
          });
          if (Array.isArray(data.mix)) {
            mix = data.mix.map(function (v) {
              return v ? 1 : 0;
            });
          }
        }

        function reset() {
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            els[key].value = DEFAULTS[key];
          });
          mix = [];
          lastText = DEFAULT_TEXT;
          try {
            localStorage.removeItem(LS_KEY);
          } catch (e) {}
          applyVars();
          paintVals();
          buildLockup();
          restart();
          if (window.ArtboardView && window.ArtboardView.reset) {
            window.ArtboardView.reset();
          }
        }

        Object.keys(els).forEach(function (key) {
          if (!els[key]) return;
          els[key].addEventListener("input", function () {
            applyVars();
            paintVals();
            if (key === "tx") buildLockup();
            else applyMix(lastPhase);
            save();
          });
        });

        loadSaved();
        lastText = els.tx ? els.tx.value : DEFAULT_TEXT;
        applyVars();
        paintVals();
        buildLockup();
        restart();

        function afterFonts() {
          applyMix(lastPhase);
        }

        if (document.fonts && document.fonts.load) {
          Promise.all([
            document.fonts.load('400 410px "IkarusPlusVariable"'),
            document.fonts.ready,
          ])
            .then(afterFonts)
            .catch(afterFonts);
        } else if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(afterFonts);
        } else {
          afterFonts();
        }

        window.AnimatorExport = {
          stage: document.getElementById("stage"),
          filename: "two-state.mp4",
          durationMs: durationMs,
          seek: function (ms) {
            applyElapsed(ms);
          },
          stop: stopPlayback,
          start: startPlayback,
        };
      })();
    </script>
    <script type="module" src="../../web-export.js?v=9"></script>
  </body>
