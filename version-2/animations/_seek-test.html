<!DOCTYPE html>
<html>
  <body style="margin: 0">
    <iframe
      id="f"
      src="alternates-list.html"
      style="width: 1600px; height: 1000px; border: 0"
    ></iframe>
    <script>
      var ms = Number(new URLSearchParams(location.search).get("ms") || 0);
      var f = document.getElementById("f");
      f.onload = function () {
        var w = f.contentWindow;
        function go() {
          if (!w.AnimatorExport) {
            requestAnimationFrame(go);
            return;
          }
          w.AnimatorExport.stop();
          w.AnimatorExport.seek(ms);
          var lockup = w.document.getElementById("lockup");
          var on = lockup.querySelectorAll(".alt-name.is-on");
          var hits = lockup.querySelectorAll(".ch.is-hit");
          var names = lockup.querySelectorAll(".alt-name");
          document.title =
            "ready names=" +
            names.length +
            " on=" +
            on.length +
            " hits=" +
            hits.length +
            " feat=" +
            (on[0] ? on[0].getAttribute("data-feat") : "none");
          var pre = document.createElement("pre");
          pre.id = "dump";
          pre.textContent = document.title + "\n" + lockup.innerHTML.slice(0, 800);
          document.body.appendChild(pre);
        }
        setTimeout(go, 500);
      };
    </script>
  </body>
</html>
