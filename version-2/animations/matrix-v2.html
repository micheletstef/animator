    <style>

      :root {
        color-scheme: light;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffffff;
        --fg: #000000;
        --line: #000000;
        --line-w: 2;
        --glyph-size: 357;
        --lh: 1.47;
        --metric-size: 26;
        --col-gap-1: 40;
        --col-gap-2: 40;
        --pad-t: 0;
        --pad-r: 0;
        --pad-b: 0;
        --pad-l: 0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d3d3d3;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #1f1f1f;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        box-shadow: none;
        pointer-events: none;
      }

      .lockup {
        position: absolute;
        top: calc(var(--pad-t) * 1px);
        right: calc(var(--pad-r) * 1px);
        bottom: calc(var(--pad-b) * 1px);
        left: calc(var(--pad-l) * 1px);
        z-index: 1;
      }

      .matrix {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        gap: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
      }

      .matrix-row {
        position: relative;
        display: block;
        flex: 0 0 auto;
        width: 100%;
        height: calc(var(--glyph-size) * var(--lh) * 1px);
        min-height: 0;
        overflow: visible;
      }

      .cell {
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        width: auto;
        min-width: 0;
        user-select: none;
        height: 100%;
        overflow: visible;
      }

      .measure {
        position: relative;
        display: inline-flex;
        align-items: flex-start;
        height: 100%;
        overflow: visible;
      }

      .glyph {
        display: block;
        font-size: calc(var(--glyph-size) * 1px);
        line-height: 1;
        white-space: nowrap;
        font-variation-settings: "wght" 200, "slnt" 0;
      }

      .glyph.fam-standard.col-condensed {
        font-family: "IkarusCondensedVariable", system-ui, sans-serif;
      }

      .glyph.fam-standard.col-default {
        font-family: "IkarusVariable", system-ui, sans-serif;
      }

      .glyph.fam-standard.col-extended {
        font-family: "IkarusExtendedVariable", system-ui, sans-serif;
      }

      .glyph.fam-flair.col-condensed {
        font-family: "IkarusFlairCondensedVariable", system-ui, sans-serif;
      }

      .glyph.fam-flair.col-default {
        font-family: "IkarusFlairVariable", system-ui, sans-serif;
      }

      .glyph.fam-flair.col-extended {
        font-family: "IkarusFlairExtendedVariable", system-ui, sans-serif;
      }

      .glyph.fam-contrast.col-condensed {
        font-family: "IkarusContrastCondensedVariable", system-ui, sans-serif;
      }

      .glyph.fam-contrast.col-default {
        font-family: "IkarusContrastVariable", system-ui, sans-serif;
      }

      .glyph.fam-contrast.col-extended {
        font-family: "IkarusContrastExtendedVariable", system-ui, sans-serif;
      }

      .line {
        position: absolute;
        top: 0;
        height: 100%;
        width: calc(var(--line-w) * 1px);
        background: var(--line);
        pointer-events: none;
        z-index: 2;
      }

      .metric {
        position: absolute;
        display: block;
        margin: 0;
        padding: 0;
        text-align: center;
        font-family: "IkarusPlusVariable", sans-serif;
        font-size: calc(var(--metric-size) * 0.7 * 1px);
        font-weight: 500;
        font-style: normal;
        font-synthesis: none;
        line-height: 1;
        letter-spacing: 0;
        color: var(--fg);
        white-space: nowrap;
        text-transform: none;
        font-variation-settings: "wght" 500, "wdth" 100, "CNTR" 0, "slnt" 0;
        font-feature-settings: "kern" 1, "liga" 1;
        font-kerning: normal;
        pointer-events: none;
        z-index: 3;
      }

      .metric-weight {
        font-variant-numeric: tabular-nums;
      }

      .metric-family {
        transform-origin: center center;
      }

      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;

      .panel .hint {

      .panel .group-title {

        font-size: 11px;
        letter-spacing: 0.06em;

      .row {
        display: grid;
        grid-template-columns: 80px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 2px;
      }

      .row input[type="text"],
      .row textarea {
        grid-column: 2 / 4;
        width: 100%;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #111;
        color: #e9e9e9;
        font: inherit;
      }

      .row textarea {
        min-height: 54px;
        resize: vertical;
        line-height: 1.25;
        white-space: pre;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .row.row-dual {
        grid-template-columns: 80px minmax(0, 1fr);
        margin-bottom: 12px;
      }

      .dual-range {
        position: relative;
        width: 100%;
        height: 40px;
        min-width: 0;
      }

      .dual-val {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        font-size: 10px;
        line-height: 1.2;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        z-index: 2;
        white-space: nowrap;
      }

      .dual-track {
        position: absolute;
        left: 7px;
        right: 7px;
        top: 24px;
        height: 3px;
        transform: translateY(-50%);
        background: #2a2a2a;
        border-radius: 2px;
        pointer-events: none;
      }

      .dual-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        background: #fff;
        border-radius: 2px;
      }

      .dual-range input[type="range"] {
        position: absolute;
        left: 0;
        right: 0;
        top: 14px;
        width: 100%;
        height: 22px;
        margin: 0;
        background: transparent;
        pointer-events: none;
        -webkit-appearance: none;
        appearance: none;
      }

      .dual-range input[type="range"]:focus {
        outline: none;
      }

      .dual-range input[type="range"]::-webkit-slider-runnable-track,
      .dual-range input[type="range"]::-moz-range-track {
        background: transparent;
        border: 0;
        height: 22px;
      }

      .dual-range input[type="range"]::-webkit-slider-thumb {
        pointer-events: auto;
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        border: 2px solid #1a1a1a;
        box-shadow: 0 0 0 1px #fff;
        margin-top: 0;
      }

      .dual-range input[type="range"]::-moz-range-thumb {
        pointer-events: auto;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        border: 2px solid #1a1a1a;
        box-shadow: 0 0 0 1px #fff;
      }

      .dual-range input.is-end[type="range"]::-webkit-slider-thumb,
      .dual-range input.is-end[type="range"]::-moz-range-thumb {
        background: #1a1a1a;
        border-color: #fff;
        box-shadow: 0 0 0 1px #fff;
      }

      .panel .actions {
        display: flex;
        gap: 8px;
        margin-top: 4px;
      }

      .panel button {
        flex: 1;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        padding: 6px 8px;
        font: inherit;
        text-transform: lowercase;
        cursor: pointer;
        border-radius: 4px;
      }

      .panel button:hover {
        border-color: #555;
        color: #fff;
      }

      .panel button:disabled {
        opacity: 0.55;
        cursor: wait;
      }
    </style>

    <script src="artboard-view.js?v=29"></script>
    <script>
      (function () {
        var FAMILIES = ["standard", "flair", "contrast"];
        var COLS = ["condensed", "default", "extended"];
        var COL_CLASS = {
          condensed: "col-condensed",
          default: "col-default",
          extended: "col-extended",
        };
        var COL_LABELS = {
          condensed: "Condensed",
          default: "Default",
          extended: "Extended",
        };
        var FAM_LABELS = {
          standard: "Standard",
          flair: "Flair",
          contrast: "Contrast",
        };

        var root = document.documentElement;
        var matrix = document.getElementById("matrix");
        var cells = [];
        var colMetrics = [];
        var W_MIN = 200;
        var W_MAX = 1000;
        var ROW_COUNT = FAMILIES.length;
        var COL_COUNT = COLS.length;

        function cellText(raw) {
          return Array.from(String(raw == null ? "" : raw)).slice(0, 2).join("");
        }

        function parseChars(raw) {
          var lines = String(raw == null ? "" : raw).split(/\r?\n/);
          var nonempty = [];
          var chars = [];
          var i;
          for (i = 0; i < lines.length; i++) {
            var compact = lines[i].replace(/[\s,]+/g, "");
            if (compact) nonempty.push(compact);
          }
          if (nonempty.length <= 1) {
            var parts = String(raw == null ? "" : raw)
              .trim()
              .split(/[\s,]+/)
              .filter(Boolean);
            if (parts.length > 1) {
              for (i = 0; i < parts.length && chars.length < ROW_COUNT; i++) {
                chars.push(cellText(parts[i].replace(/[\s,]+/g, "")));
              }
            } else {
              var units = Array.from(nonempty.join(""));
              if (units.length > ROW_COUNT) {
                for (i = 0; i < ROW_COUNT && i * 2 < units.length; i++) {
                  chars.push(units.slice(i * 2, i * 2 + 2).join(""));
                }
              } else {
                chars = units.slice(0, ROW_COUNT);
              }
            }
          } else {
            for (i = 0; i < nonempty.length && chars.length < ROW_COUNT; i++) {
              chars.push(cellText(nonempty[i]));
            }
          }
          if (!chars.length) chars = ["a"];
          while (chars.length < ROW_COUNT) chars.push(chars[0]);
          return chars;
        }

        function createMetric(className, text) {
          var el = document.createElement("span");
          el.className = "metric " + className;
          el.textContent = text;
          el.style.fontWeight = "500";
          el.style.fontVariationSettings =
            '"wght" 500, "wdth" 100, "CNTR" 0, "slnt" 0';
          return el;
        }

        function createCell(row, col, ch) {
          var cell = document.createElement("div");
          cell.className = "cell";

          var measure = document.createElement("div");
          measure.className = "measure";

          var lineLeft = document.createElement("span");
          lineLeft.className = "line line-left";
          lineLeft.setAttribute("aria-hidden", "true");

          var glyph = document.createElement("span");
          glyph.className =
            "glyph fam-" + FAMILIES[row] + " " + COL_CLASS[COLS[col]];
          glyph.textContent = ch;

          var lineRight = document.createElement("span");
          lineRight.className = "line line-right";
          lineRight.setAttribute("aria-hidden", "true");

          var metricLabel = null;
          var metricFamily = null;
          var metricWeight = null;
          if (row === 0) {
            metricLabel = createMetric("metric-label", COL_LABELS[COLS[col]]);
          }
          if (col === 0) {
            metricFamily = createMetric("metric-family", FAM_LABELS[FAMILIES[row]]);
          }
          if (row === ROW_COUNT - 1) {
            metricWeight = createMetric("metric-weight", "200");
          }

          measure.appendChild(lineLeft);
          measure.appendChild(glyph);
          measure.appendChild(lineRight);
          if (metricLabel) measure.appendChild(metricLabel);
          if (metricFamily) measure.appendChild(metricFamily);
          if (metricWeight) measure.appendChild(metricWeight);
          cell.appendChild(measure);

          return {
            row: row,
            col: col,
            cell: cell,
            measure: measure,
            glyph: glyph,
            lineLeft: lineLeft,
            lineRight: lineRight,
            metricLabel: metricLabel,
            metricFamily: metricFamily,
            metricWeight: metricWeight,
            weight: W_MIN,
          };
        }

        function buildMatrix(chars) {
          chars = chars && chars.length === ROW_COUNT ? chars : parseChars("");
          matrix.innerHTML = "";
          cells = [];
          colMetrics = [];
          for (r = 0; r < ROW_COUNT; r++) {
            var rowEl = document.createElement("div");
            rowEl.className = "matrix-row";
            for (var c = 0; c < COL_COUNT; c++) {
              var item = createCell(r, c, chars[r]);
              rowEl.appendChild(item.cell);
              cells.push(item);
              if (item.metricWeight) colMetrics.push(item.metricWeight);
            }
            matrix.appendChild(rowEl);
          }
        }

        function applyChars(raw) {
          var chars = parseChars(raw);
          if (cells.length !== ROW_COUNT * COL_COUNT) {
            buildMatrix(chars);
          } else {
            for (var i = 0; i < cells.length; i++) {
              cells[i].glyph.textContent = chars[cells[i].row];
            }
          }
        }

        var LS_KEY = "animator:v2:matrix-v2:settings:v5";
        var t0 = 0;
        var raf = 0;
        var playing = true;

        var DEFAULTS = {
          bg: "#ffffff",
          fg: "#000000",
          ln: "#000000",
          lw: 2,
          ch: "a b c",
          fs: 357,
          lh: 1.47,
          ms: 26,
          g0: 40,
          g1: 40,
          w0: W_MIN,
          w1: W_MAX,
          cy: 4000,
          hd: 0,
        };

        var COLOR_KEYS = { bg: 1, fg: 1, ln: 1 };
        var TEXT_KEYS = { ch: 1 };

        var els = {
          bg: document.getElementById("bg"),
          fg: document.getElementById("fg"),
          ln: document.getElementById("ln"),
          lw: document.getElementById("lw"),
          ch: document.getElementById("ch"),
          fs: document.getElementById("fs"),
          lh: document.getElementById("lh"),
          ms: document.getElementById("ms"),
          g0: document.getElementById("g0"),
          g1: document.getElementById("g1"),
          w0: document.getElementById("w0"),
          w1: document.getElementById("w1"),
          cy: document.getElementById("cy"),
          hd: document.getElementById("hd"),
        };

        var WGHT_DUAL = {
          start: "w0",
          end: "w1",
          fill: "wFill",
        };

        var vals = {
          bg: document.getElementById("bg-val"),
          fg: document.getElementById("fg-val"),
          ln: document.getElementById("ln-val"),
          lw: document.getElementById("lw-val"),
          fs: document.getElementById("fs-val"),
          lh: document.getElementById("lh-val"),
          ms: document.getElementById("ms-val"),
          g0: document.getElementById("g0-val"),
          g1: document.getElementById("g1-val"),
          cy: document.getElementById("cy-val"),
          hd: document.getElementById("hd-val"),
        };

        function easeInOutCubic(t) {
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function phaseFromElapsed(elapsed, halfCycle, hold) {
          if (elapsed < halfCycle) {
            return elapsed / halfCycle;
          }
          if (elapsed < halfCycle + hold) {
            return 1;
          }
          if (elapsed < halfCycle + hold + halfCycle) {
            return 1 - (elapsed - halfCycle - hold) / halfCycle;
          }
          return 0;
        }

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function weightRange() {
          var start = parseFloat(els.w0.value);
          var end = parseFloat(els.w1.value);
          if (!isFinite(start)) start = W_MIN;
          if (!isFinite(end)) end = W_MAX;
          return {
            start: Math.max(W_MIN, Math.min(W_MAX, start)),
            end: Math.max(W_MIN, Math.min(W_MAX, end)),
          };
        }

        function weightForRow(row, p) {
          var range = weightRange();
          return lerp(range.start, range.end, easeInOutCubic(p));
        }

        function thumbPct(el) {
          var min = parseFloat(el.min);
          var max = parseFloat(el.max);
          var span = max - min || 1;
          return ((parseFloat(el.value) - min) / span) * 100;
        }

        function updateDualUI() {
          var startEl = els.w0;
          var endEl = els.w1;
          if (!startEl || !endEl) return;
          var fill = document.getElementById(WGHT_DUAL.fill);
          var startVal = document.getElementById("w0Val");
          var endVal = document.getElementById("w1Val");
          var a = parseFloat(startEl.value);
          var b = parseFloat(endEl.value);
          var min = parseFloat(startEl.min);
          var max = parseFloat(startEl.max);
          var span = max - min || 1;
          var lo = Math.min(a, b);
          var hi = Math.max(a, b);
          if (fill) {
            fill.style.left = ((lo - min) / span) * 100 + "%";
            fill.style.width = Math.max(0, ((hi - lo) / span) * 100) + "%";
          }
          if (startVal) {
            startVal.textContent = String(Math.round(a));
            startVal.style.left = thumbPct(startEl) + "%";
          }
          if (endVal) {
            endVal.textContent = String(Math.round(b));
            endVal.style.left = thumbPct(endEl) + "%";
          }
        }

        function formatVal(key, v) {
          if (key === "bg" || key === "fg" || key === "ln") return String(v).toLowerCase();
          if (key === "ch") return String(v);
          if (key === "lh") return Number(v).toFixed(2);
          if (key === "lw") {
            var n = Number(v);
            return (n % 1 === 0 ? String(n) : n.toFixed(2)) + "px";
          }
          if (key === "fs" || key === "ms" || key === "g0" || key === "g1") {
            return Math.round(Number(v)) + "px";
          }
          if (key === "cy") return formatMs(Number(v));
          if (key === "hd") return formatMs(Number(v));
          return String(v);
        }

        function formatMs(ms) {
          if (ms >= 1000) return (ms / 1000).toFixed(1) + "s";
          return Math.round(ms) + "ms";
        }

        function applyAppearance() {
          root.style.setProperty("--bg", els.bg.value);
          root.style.setProperty("--fg", els.fg.value);
          root.style.setProperty("--line", els.ln.value);
          root.style.setProperty("--line-w", String(parseFloat(els.lw.value)));
          root.style.setProperty("--glyph-size", parseFloat(els.fs.value));
          root.style.setProperty("--lh", String(parseFloat(els.lh.value)));
          root.style.setProperty("--metric-size", parseFloat(els.ms.value));
          root.style.setProperty("--col-gap-1", parseFloat(els.g0.value));
          root.style.setProperty("--col-gap-2", parseFloat(els.g1.value));
          layoutGuides();
        }

        function setValue(key, v, persist) {
          els[key].value = v;
          if (vals[key]) vals[key].textContent = formatVal(key, v);
          if (key === "ch") {
            applyChars(v);
            if (t0) applyElapsed(performance.now() - t0);
            else layoutGuides();
          } else if (
            key === "bg" ||
            key === "fg" ||
            key === "ln" ||
            key === "lw" ||
            key === "fs" ||
            key === "lh" ||
            key === "ms" ||
            key === "g0" ||
            key === "g1"
          ) {
            applyAppearance();
          } else if (key === "w0" || key === "w1") {
            updateDualUI();
          }
          if (persist !== false) save();
        }

        function save() {
          var out = {};
          Object.keys(els).forEach(function (k) {
            if (TEXT_KEYS[k]) out[k] = els[k].value;
            else out[k] = COLOR_KEYS[k] ? els[k].value : parseFloat(els[k].value);
          });
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(out));
          } catch (e) {}
        }

        function load() {
          var raw;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {
            raw = null;
          }
          var data = DEFAULTS;
          if (raw) {
            try {
              data = Object.assign({}, DEFAULTS, JSON.parse(raw));
            } catch (e) {}
          }
          Object.keys(els).forEach(function (k) {
            setValue(k, data[k], false);
          });
        }

        Object.keys(els).forEach(function (k) {
          els[k].addEventListener("input", function () {
            var v =
              TEXT_KEYS[k] || COLOR_KEYS[k] ? els[k].value : parseFloat(els[k].value);
            setValue(k, v);
          });
        });

        function setRowWeights(p) {
          for (var i = 0; i < cells.length; i++) {
            var c = cells[i];
            var w = weightForRow(c.row, p);
            c.weight = w;
            c.glyph.style.fontVariationSettings =
              '"wght" ' + w.toFixed(1) + ', "slnt" 0';
          }
        }

        function viewScale() {
          var api = window.ArtboardView && window.ArtboardView.current;
          if (api && api.apply) {
            var state = api.apply();
            if (state && state.scale > 0) return state.scale;
          }
          return 1;
        }

        function layoutColumnJustify(zoom) {
          if (!cells.length) return;
          var rowEl = cells[0].cell.parentNode;
          if (!rowEl) return;
          var avail = rowEl.getBoundingClientRect().width / zoom;
          if (!isFinite(avail) || avail < 1) return;

          var g1 = parseFloat(els.g0.value);
          var g2 = parseFloat(els.g1.value);
          if (!isFinite(g1)) g1 = 40;
          if (!isFinite(g2)) g2 = 40;
          var t1 = Math.max(0.001, g1 + 80);
          var t2 = Math.max(0.001, g2 + 80);
          var tsum = t1 + t2;
          var r;
          var i;
          var rowCells;
          var widths;
          var inner;
          var space1;
          var xs;

          for (r = 0; r < ROW_COUNT; r++) {
            rowCells = [];
            widths = [];
            for (i = 0; i < cells.length; i++) {
              if (cells[i].row !== r) continue;
              rowCells.push(cells[i]);
              var gw = cells[i].glyph.getBoundingClientRect().width / zoom;
              widths.push(gw > 0 ? gw : 0);
            }
            if (rowCells.length !== COL_COUNT) continue;
            inner = avail - widths[0] - widths[1] - widths[2];
            if (inner < 0) inner = 0;
            space1 = inner * (t1 / tsum);
            xs = [0, widths[0] + space1, avail - widths[2]];
            for (i = 0; i < COL_COUNT; i++) {
              rowCells[i].cell.style.left = xs[i] + "px";
            }
          }
        }

        function layoutGuides() {
          var zoom = viewScale();
          layoutColumnJustify(zoom);
          var rowStats = [];
          var r;
          var i;
          var c;

          for (r = 0; r < ROW_COUNT; r++) {
            rowStats.push({
              top: Infinity,
              bottom: -Infinity,
              glyphBottom: -Infinity,
            });
          }

          for (i = 0; i < cells.length; i++) {
            c = cells[i];
            var stat = rowStats[c.row];
            var cellRect = c.cell.getBoundingClientRect();
            stat.top = Math.min(stat.top, cellRect.top);
            stat.bottom = Math.max(stat.bottom, cellRect.bottom);
            var glyphRect = c.glyph.getBoundingClientRect();
            if (glyphRect.height) {
              stat.glyphBottom = Math.max(stat.glyphBottom, glyphRect.bottom);
            }
          }

          for (i = 0; i < cells.length; i++) {
            c = cells[i];
            var row = rowStats[c.row];
            if (!isFinite(row.top)) continue;

            var g = c.glyph.getBoundingClientRect();
            var m = c.measure.getBoundingClientRect();
            if (!g.width) continue;

            var clipTop = row.top;
            var clipBottom = row.bottom;
            if (c.row < ROW_COUNT - 1) {
              var nextTop = rowStats[c.row + 1].top;
              if (isFinite(nextTop)) clipBottom = nextTop;
            } else if (isFinite(row.glyphBottom)) {
              clipBottom = row.glyphBottom;
            }

            var lineHeight = (clipBottom - clipTop) / zoom;
            if (c.row < ROW_COUNT - 1) lineHeight += 1;
            if (lineHeight < 1) {
              c.lineLeft.style.display = "none";
              c.lineRight.style.display = "none";
              if (c.metricLabel) c.metricLabel.style.display = "none";
              if (c.metricFamily) c.metricFamily.style.display = "none";
              if (c.metricWeight) c.metricWeight.style.display = "none";
              continue;
            }

            var leftX = (g.left - m.left) / zoom;
            var rightX = (g.right - m.left) / zoom;
            var lineTop = (clipTop - m.top) / zoom;
            var span = Math.max(0, rightX - leftX);
            var lineW = parseFloat(els.lw.value);
            if (!isFinite(lineW)) lineW = 2;

            c.lineLeft.style.display = "block";
            c.lineRight.style.display = "block";
            c.lineLeft.style.left = leftX + "px";
            c.lineLeft.style.top = lineTop + "px";
            c.lineLeft.style.height = lineHeight + "px";
            c.lineRight.style.left = rightX - lineW + "px";
            c.lineRight.style.top = lineTop + "px";
            c.lineRight.style.height = lineHeight + "px";

            var metricSize = parseFloat(els.ms.value);
            if (!isFinite(metricSize)) metricSize = 26;
            metricSize *= 0.7;

            if (c.metricLabel) {
              c.metricLabel.style.display = "block";
              c.metricLabel.style.left = leftX + "px";
              c.metricLabel.style.width = span + "px";
              c.metricLabel.style.top = lineTop + "px";
            }
            if (c.metricFamily) {
              c.metricFamily.style.display = "block";
              c.metricFamily.style.left =
                leftX - metricSize / 2 - 8 + "px";
              c.metricFamily.style.width = "auto";
              c.metricFamily.style.top = lineTop + lineHeight / 2 + "px";
              c.metricFamily.style.transform =
                "translate(-50%, -50%) rotate(-90deg)";
            }
            if (c.metricWeight) {
              c.metricWeight.style.display = "block";
              c.metricWeight.style.left = leftX + "px";
              c.metricWeight.style.width = span + "px";
              c.metricWeight.style.top =
                lineTop + lineHeight - metricSize + "px";
            }
          }

          var weightLabel = cells.length ? String(Math.round(cells[0].weight)) : "200";
          for (i = 0; i < colMetrics.length; i++) {
            colMetrics[i].textContent = weightLabel;
          }
        }

        function applyElapsed(elapsed) {
          var cycle = Math.max(200, parseFloat(els.cy.value));
          var hold = Math.max(0, parseFloat(els.hd.value));
          var halfCycle = cycle / 2;
          var total = cycle + 2 * hold;
          if (total <= 0) total = 1;
          var t = elapsed % total;
          if (t < 0) t += total;
          var p = phaseFromElapsed(t, halfCycle, hold);
          setRowWeights(p);
          layoutGuides();
        }

        function frame(now) {
          applyElapsed(now - t0);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function durationMs() {
          var cycle = Math.max(200, parseFloat(els.cy.value));
          var hold = Math.max(0, parseFloat(els.hd.value));
          return Math.max(1, cycle + 2 * hold);
        }

        function stopPlayback() {
          playing = false;
          cancelAnimationFrame(raf);
          raf = 0;
        }

        function startPlayback() {
          playing = true;
          restart();
        }

        function restart() {
          t0 = performance.now();
          applyElapsed(0);
          cancelAnimationFrame(raf);
          if (playing) raf = requestAnimationFrame(frame);
        }

        window.addEventListener("resize", layoutGuides);

        load();

        function start() {
          restart();
        }

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(start);
        } else {
          start();
        }

        window.AnimatorExport = {
          stage: document.getElementById("stage"),
          filename: "matrix-v2.mp4",
          durationMs: durationMs,
          seek: function (ms) {
            applyElapsed(ms);
          },
          stop: stopPlayback,
          start: startPlayback,
        };
      })();
    </script>
    <script type="module" src="../../web-export.js?v=9"></script>
  </body>
