<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <title>conveyor</title>
    <style>
      @font-face {
        font-family: "IkarusPlusVariable";
        src: url("../../fonts/ABCIkarusPlusVariable.ttf") format("truetype-variations");
        font-weight: 100 1000;
        font-stretch: 65% 130%;
        font-style: normal;
        font-display: block;
      }

      :root {
        color-scheme: light;
        --ar-w: 1080;
        --ar-h: 1440;
        --bg: #ffffff;
        --fg: #000000;
        --pad-t: 80;
        --pad-r: 32;
        --pad-b: 32;
        --pad-l: 32;
        --fs: 290;
        --lh: 0.77;
        --tracking: 0;
        --gap: 140;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d3d3d3;
        overflow: hidden;
        font-family: "Courier New", Courier, monospace;
        color: #1f1f1f;
      }

      body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 280px;
        align-items: stretch;
        gap: 24px;
        padding: 24px;
      }

      .stage-wrap {
        position: relative;
        height: 100%;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }

      .stage-wrap.is-panning {
        cursor: grabbing;
      }

      .stage-outer {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 1440px;
        transform-origin: 0 0;
        will-change: transform;
      }

      .stage {
        position: relative;
        width: 1080px;
        height: 1440px;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        box-shadow: none;
        font-family: "IkarusPlusVariable", sans-serif;
        font-synthesis: none;
        font-feature-settings: "liga" 0, "kern" 1;
        pointer-events: none;
      }

      .belt {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 1080px;
        overflow: hidden;
      }

      .track {
        position: absolute;
        left: 0;
        top: calc(var(--pad-t) * 1px);
        width: 1080px;
        will-change: transform;
      }

      .cycle {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 1080px;
      }

      .block {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 1080px;
        margin-bottom: 0;
        text-align: center;
      }

      .block.is-row {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: baseline;
        justify-content: center;
      }

      .block.is-row .line-slot {
        width: auto;
        align-items: baseline;
      }

      .line-slot {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 1080px;
        overflow: visible;
      }

      .line {
        display: block;
        width: max-content;
        max-width: none;
        margin: 0;
        text-align: center;
        white-space: nowrap;
        font-kerning: none;
        font-synthesis: none;
        -webkit-font-smoothing: antialiased;
      }


      .panel {
        align-self: stretch;
        max-height: 100%;
        overflow: auto;
        padding: 16px 18px;
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.4;
      }

      .panel h2 {
        margin: 0 0 4px 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.04em;
        color: #9a9a9a;
      }

      .panel .hint {
        margin: 0 0 14px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .panel .group {
        margin-bottom: 18px;
      }

      .panel .group-title {
        text-transform: lowercase;
        color: #6a6a6a;
        margin: 0 0 8px 0;
        font-size: 11px;
        letter-spacing: 0.06em;
      }

      .row {
        display: grid;
        grid-template-columns: 64px 1fr 52px;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .row label {
        text-transform: lowercase;
        color: #cfcfcf;
      }

      .row input[type="range"] {
        width: 100%;
        accent-color: #fff;
      }

      .row input[type="checkbox"] {
        width: 16px;
        height: 16px;
        justify-self: start;
        accent-color: #fff;
        cursor: pointer;
      }

      .row input[type="color"] {
        width: 100%;
        height: 22px;
        padding: 0;
        border: 1px solid #333;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
      }

      .row input[type="color"]::-webkit-color-swatch-wrapper {
        padding: 2px;
      }

      .row input[type="color"]::-webkit-color-swatch {
        border: 0;
        border-radius: 2px;
      }

      .row .val {
        text-align: right;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
      }

      .now {
        margin: 0 0 8px 0;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        font-size: 11px;
      }

      .kf-seq {
        margin: 0 0 10px 0;
        color: #6a6a6a;
        font-size: 11px;
      }

      .kf-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 4px;
      }

      .panel .kf-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        flex: none;
        min-height: 64px;
        padding: 8px 4px;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        border-radius: 4px;
        font: inherit;
        font-family: "Courier New", Courier, monospace;
        text-transform: lowercase;
        cursor: pointer;
      }

      .kf-tab:hover {
        border-color: #555;
        color: #fff;
      }

      .kf-tab.is-on {
        border-color: #fff;
        color: #fff;
        background: #111;
      }

      .kf-tab.is-live:not(.is-on) {
        border-color: #888;
      }

      .kf-tab-n {
        font-size: 13px;
        line-height: 1;
      }

      .kf-tab-v {
        color: #9a9a9a;
        font-size: 10px;
        line-height: 1.2;
        text-align: center;
      }

      .kf-tab.is-on .kf-tab-v {
        color: #cfcfcf;
      }

      .block-list {
        margin: 0;
        padding: 0;
        list-style: none;
        color: #9a9a9a;
        font-size: 11px;
      }

      .block-list li {
        display: grid;
        grid-template-columns: 72px 1fr;
        gap: 8px;
        margin: 0 0 4px 0;
      }

      .block-list .n {
        color: #cfcfcf;
        text-transform: lowercase;
      }

      .line-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-bottom: 10px;
      }

      .panel .line-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        flex: none;
        min-height: 36px;
        padding: 6px 6px;
        background: transparent;
        color: #cfcfcf;
        border: 1px solid #333;
        border-radius: 4px;
        font: inherit;
        font-family: "Courier New", Courier, monospace;
        text-transform: lowercase;
        cursor: pointer;
      }

      .line-tab:hover {
        border-color: #555;
        color: #fff;
      }

      .line-tab.is-on {
        border-color: #fff;
        color: #fff;
        background: #111;
      }

      .line-tab-n {
        font-size: 11px;
        line-height: 1.2;
        text-align: center;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .row.row-dual {
        grid-template-columns: 64px minmax(0, 1fr);
        margin-bottom: 12px;
      }

      .dual-range {
        position: relative;
        width: 100%;
        height: 40px;
        min-width: 0;
      }

      .dual-val {
        position: absolute;
        top: 0;
        transform: translateX(-50%);
        font-size: 10px;
        line-height: 1.2;
        color: #9a9a9a;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
        z-index: 2;
        white-space: nowrap;
      }

      .dual-track {
        position: absolute;
        left: 7px;
        right: 7px;
        top: 24px;
        height: 3px;
        transform: translateY(-50%);
        background: #2a2a2a;
        border-radius: 2px;
        pointer-events: none;
      }

      .dual-fill {
        position: absolute;
        top: 0;
        bottom: 0;
        background: #fff;
        border-radius: 2px;
      }

      .dual-range input[type="range"] {
        position: absolute;
        left: 0;
        right: 0;
        top: 14px;
        width: 100%;
        height: 22px;
        margin: 0;
        background: transparent;
        pointer-events: none;
        -webkit-appearance: none;
        appearance: none;
      }

      .dual-range input[type="range"]:focus {
        outline: none;
      }

      .dual-range input[type="range"]::-webkit-slider-runnable-track,
      .dual-range input[type="range"]::-moz-range-track {
        background: transparent;
        border: 0;
        height: 22px;
      }

      .dual-range input[type="range"]::-webkit-slider-thumb {
        pointer-events: auto;
        -webkit-appearance: none;
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        border: 2px solid #1a1a1a;
        box-shadow: 0 0 0 1px #fff;
        margin-top: 0;
      }

      .dual-range input[type="range"]::-moz-range-thumb {
        pointer-events: auto;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        border: 2px solid #1a1a1a;
        box-shadow: 0 0 0 1px #fff;
      }

      .dual-range input.is-end[type="range"]::-webkit-slider-thumb,
      .dual-range input.is-end[type="range"]::-moz-range-thumb {
        background: #1a1a1a;
        border-color: #fff;
        box-shadow: 0 0 0 1px #fff;
      }
    </style>
    <link rel="stylesheet" href="../../animation-chrome.css?v=38" />
    <style>
      .panel .line-tab {
        border-color: rgba(31, 31, 31, 0.28);
        background: #fff;
        color: #1f1f1f;
      }

      .panel .line-tab:hover {
        border-color: #1f1f1f;
        color: #000;
      }

      .panel .line-tab.is-on {
        border-color: #1f1f1f;
        color: #fff;
        background: #1f1f1f;
      }
    </style>
  </head>
  <body data-no-caption data-guide-margin="32">
    <div class="stage-wrap" id="stageWrap">
      <div class="stage-outer">
        <div class="stage" id="stage" aria-label="conveyor">
          <div class="belt" id="belt">
            <div class="track" id="track"></div>
          </div>
        </div>
      </div>
    </div>
    <aside class="panel" aria-label="Settings">
      <h2>settings</h2>
      <p class="hint">
        scroll to zoom · drag to pan · double-click to fit · 1080 × 1440
      </p>

      <div class="group">
        <p class="group-title">color</p>
        <div class="row">
          <label for="bg">bg</label>
          <input id="bg" type="color" value="#ffffff" />
          <span class="val" id="bgVal">#ffffff</span>
        </div>
        <div class="row">
          <label for="fg">text</label>
          <input id="fg" type="color" value="#000000" />
          <span class="val" id="fgVal">#000000</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">type</p>
        <div class="row">
          <label for="scale">scale</label>
          <input id="scale" type="range" min="50" max="130" step="1" value="100" />
          <span class="val" id="scaleVal">100%</span>
        </div>
      </div>

      <div class="group">
        <p class="group-title">gaps</p>
        <div id="blockGaps"></div>
      </div>

      <div class="group">
        <p class="group-title">keyframes</p>
        <p class="now" id="nowReadout">pose 1 → 2 → 1</p>
        <p class="kf-seq" id="kfSeq">1 → 2 → 1 · click a pose to hold</p>
        <div class="kf-tabs" role="tablist" aria-label="poses">
          <button type="button" class="kf-tab" id="kfTab0" data-kf="0" role="tab" aria-selected="false">
            <span class="kf-tab-n">1</span>
            <span class="kf-tab-v">hold</span>
          </button>
          <button type="button" class="kf-tab" id="kfTab1" data-kf="1" role="tab" aria-selected="false">
            <span class="kf-tab-n">2</span>
            <span class="kf-tab-v">hold</span>
          </button>
        </div>
      </div>

      <div class="group">
        <p class="group-title">lines</p>
        <div class="line-tabs" id="lineTabs" role="tablist" aria-label="lines"></div>
        <p class="now" id="lineReadout">pose 1 → 2</p>
        <div id="lineAxes"></div>
      </div>

      <div class="group">
        <p class="group-title">motion</p>
        <div class="row">
          <label for="loop">loop</label>
          <input id="loop" type="range" min="6" max="40" step="0.5" value="16" />
          <span class="val" id="loopVal">16s</span>
        </div>
        <div class="row">
          <label for="scroll">belt</label>
          <input id="scroll" type="checkbox" checked />
          <span class="val" id="scrollVal">on</span>
        </div>
        <div class="row">
          <label for="shift">shift</label>
          <input id="shift" type="range" min="0" max="1000" step="1" value="0" />
          <span class="val" id="shiftVal">0%</span>
        </div>
        <div class="row">
          <label for="hold">hold</label>
          <input id="hold" type="range" min="80" max="2000" step="20" value="880" />
          <span class="val" id="holdVal">880ms</span>
        </div>
        <div class="row">
          <label for="snap">snap</label>
          <input id="snap" type="range" min="80" max="1600" step="10" value="520" />
          <span class="val" id="snapVal">520ms</span>
        </div>
      </div>
    </aside>

    <script src="artboard-view.js?v=30"></script>
    <script>
      (function () {
        function pose(fs, lh, track, wght, wdth, cntr, slnt, after) {
          return {
            fs: fs,
            lh: lh,
            track: track,
            wght: wght,
            wdth: wdth,
            cntr: cntr,
            slnt: slnt,
            after: after || 0,
          };
        }

        function clonePose(p) {
          return pose(p.fs, p.lh, p.track, p.wght, p.wdth, p.cntr, p.slnt, p.after);
        }

        function cloneBlocks(src) {
          return src.map(function (block) {
            return {
              name: block.name,
              gap: block.gap == null ? 140 : block.gap,
              pairGap: block.pairGap == null ? 64 : block.pairGap,
              row: !!block.row,
              lines: block.lines.map(function (line) {
                return {
                  text: line.text,
                  pair: !!line.pair,
                  from: clonePose(line.from),
                  to: clonePose(line.to),
                };
              }),
            };
          });
        }

        var BLOCK_DEFS = [
          {
            name: "sparmax",
            lines: [
              {
                text: "SPARMAX",
                from: pose(290, 224, 0, 427, 67, 57, 0, 48),
                to: pose(150, 124, -0.08, 800, 130, 50, 0, 4),
              },
              {
                text: "SP-20X",
                from: pose(290, 224, -0.01, 427, 100, 57, 0),
                to: pose(282, 224, -0.01, 407, 67, 57, 0),
              },
            ],
          },
          {
            name: "grex",
            lines: [
              {
                text: "Grex",
                from: pose(250, 224, -0.07, 1000, 82, 0, 0),
                to: pose(250, 224, 0.01, 520, 100, 100, 0),
              },
              {
                text: "TRITIUM",
                from: pose(250, 224, -0.07, 1000, 82, 0, 0),
                to: pose(250, 224, 0.01, 520, 100, 100, 0),
              },
            ],
          },
          {
            name: "iwata",
            lines: [
              {
                text: "IWATA",
                from: pose(220, 224, 0.08, 200, 100, 0, 0),
                to: pose(220, 224, -0.04, 980, 100, 0, -12),
              },
              {
                text: "neo",
                from: pose(220, 224, 0.08, 200, 100, 0, 0),
                to: pose(220, 224, -0.04, 980, 100, 0, -12),
              },
            ],
          },
          {
            name: "hs",
            row: true,
            lines: [
              {
                text: "H&S",
                pair: true,
                from: pose(160, 180, 0.05, 420, 90, 50, 0),
                to: pose(160, 180, 0.12, 420, 126, 50, 0),
              },
              {
                text: "ULTRA",
                from: pose(160, 180, 0.05, 420, 90, 50, 0),
                to: pose(160, 180, 0.12, 420, 126, 50, 0),
              },
            ],
          },
          {
            name: "badger",
            lines: [
              {
                text: "BADGER",
                from: pose(250, 224, -0.02, 680, 100, 0, 0),
                to: pose(250, 224, -0.05, 1000, 90, 0, 0),
              },
              {
                text: "350",
                from: pose(250, 224, -0.02, 680, 100, 0, 0),
                to: pose(250, 224, -0.05, 1000, 90, 0, 0),
              },
            ],
          },
        ];

        var BLOCKS = cloneBlocks(BLOCK_DEFS);
        var LS_KEY = "animator:v2:conveyor:settings:v3";
        var STAGE_H = 1440;
        var root = document.documentElement;
        var stage = document.getElementById("stage");
        var track = document.getElementById("track");
        var nowReadout = document.getElementById("nowReadout");
        var kfSeq = document.getElementById("kfSeq");
        var kfTabs = [
          document.getElementById("kfTab0"),
          document.getElementById("kfTab1"),
        ];

        var DEFAULTS = {
          bg: "#ffffff",
          fg: "#000000",
          scale: 100,
          loop: 16,
          scroll: "1",
          hold: 880,
          snap: 520,
        };

        var COLOR_KEYS = { bg: 1, fg: 1 };
        var CHECK_KEYS = { scroll: 1 };

        var els = {};
        var vals = {
          bg: document.getElementById("bgVal"),
          fg: document.getElementById("fgVal"),
          scale: document.getElementById("scaleVal"),
          loop: document.getElementById("loopVal"),
          scroll: document.getElementById("scrollVal"),
          hold: document.getElementById("holdVal"),
          snap: document.getElementById("snapVal"),
        };

        Object.keys(DEFAULTS).forEach(function (key) {
          els[key] = document.getElementById(key);
        });

        var t0 = 0;
        var raf = 0;
        var playing = true;
        var lastElapsed = 0;
        var beltMs = 0;
        var beltY = 0;
        var lastFrame = 0;
        var holdKf = -1;
        var lastLiveKf = -1;
        var loopHeight = 1;
        var nodes = [];
        var activeLine = 0;
        var syncingPoses = false;
        var lineTabsEl = document.getElementById("lineTabs");
        var lineReadout = document.getElementById("lineReadout");
        var lineAxesEl = document.getElementById("lineAxes");
        var blockGapsEl = document.getElementById("blockGaps");
        var GAP_MIN = 0;
        var GAP_MAX = 600;
        var GAP_DEFAULT = 140;
        var PAIR_MIN = 0;
        var PAIR_MAX = 400;
        var PAIR_DEFAULT = 64;
        var lineEls = {};
        var LINE_AXES = [
          { key: "fs", id: "lnFs", label: "size", min: 80, max: 900, step: 1 },
          { key: "lh", id: "lnLh", label: "lead", min: 60, max: 900, step: 1 },
          { key: "track", id: "lnTr", label: "track", min: -0.16, max: 2, step: 0.005 },
          { key: "wght", id: "lnWg", label: "wght", min: 100, max: 1000, step: 1 },
          { key: "wdth", id: "lnWd", label: "wdth", min: 65, max: 130, step: 1 },
          { key: "cntr", id: "lnCn", label: "CNTR", min: 0, max: 100, step: 1 },
          { key: "slnt", id: "lnSl", label: "slnt", min: -12, max: 0, step: 0.25 },
        ];

        function lerp(a, b, t) {
          return a + (b - a) * t;
        }

        function clamp01(t) {
          if (t <= 0) return 0;
          if (t >= 1) return 1;
          return t;
        }

        function ease(t) {
          t = clamp01(t);
          return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        function scale() {
          return Math.max(0.2, num("scale", 100) / 100);
        }

        function scrollOn() {
          return !!(els.scroll && els.scroll.checked);
        }

        function num(key, fallback) {
          var n = els[key] ? parseFloat(els[key].value) : fallback;
          return isFinite(n) ? n : fallback;
        }

        function flatLines() {
          var out = [];
          var i;
          var j;
          for (i = 0; i < BLOCKS.length; i++) {
            for (j = 0; j < BLOCKS[i].lines.length; j++) {
              out.push(BLOCKS[i].lines[j]);
            }
          }
          return out;
        }

        function activeSpec() {
          var lines = flatLines();
          if (!lines.length) return null;
          if (activeLine < 0) activeLine = 0;
          if (activeLine >= lines.length) activeLine = lines.length - 1;
          return lines[activeLine];
        }

        function mergePose(target, src) {
          if (!target || !src) return;
          ["fs", "lh", "track", "wght", "wdth", "cntr", "slnt", "after"].forEach(function (key) {
            if (src[key] == null) return;
            var n = Number(src[key]);
            if (isFinite(n)) target[key] = n;
          });
        }

        var OLD_BLOCK_ORDER = ["sparmax", "iwata", "grex", "badger", "hs"];

        function savedByBlockName(list) {
          var map = {};
          var i;
          if (!list || !list.length) return map;
          if (list[0] && list[0].name) {
            for (i = 0; i < list.length; i++) {
              if (list[i] && list[i].name) map[list[i].name] = list[i];
            }
            return map;
          }
          for (i = 0; i < list.length; i++) {
            if (OLD_BLOCK_ORDER[i]) map[OLD_BLOCK_ORDER[i]] = list[i];
          }
          return map;
        }

        function applySavedPoses(data) {
          if (!data || !data.length) return;
          var byName = savedByBlockName(data);
          BLOCKS.forEach(function (block) {
            var entry = byName[block.name];
            var lines = entry && entry.lines ? entry.lines : entry;
            if (!lines || !lines.length) return;
            block.lines.forEach(function (line, j) {
              var saved = lines[j] || (lines.length === 1 ? lines[0] : null);
              if (!saved) return;
              mergePose(line.from, saved.from);
              mergePose(line.to, saved.to);
            });
          });
        }

        function blockGapLabel(block) {
          if (block.name === "hs") return "h&s";
          return block.name;
        }

        function clampGap(n) {
          n = Number(n);
          if (!isFinite(n)) return GAP_DEFAULT;
          return Math.max(GAP_MIN, Math.min(GAP_MAX, n));
        }

        function clampPairGap(n) {
          n = Number(n);
          if (!isFinite(n)) return PAIR_DEFAULT;
          return Math.max(PAIR_MIN, Math.min(PAIR_MAX, n));
        }

        function applySavedGaps(data) {
          var i;
          var n;
          var byName;
          if (data.blockGaps && data.blockGaps.length) {
            byName = savedByBlockName(
              data.blockGaps[0] && data.blockGaps[0].name
                ? data.blockGaps
                : data.blockGaps.map(function (gap, idx) {
                    return { name: OLD_BLOCK_ORDER[idx], gap: gap };
                  })
            );
            BLOCKS.forEach(function (block) {
              var entry = byName[block.name];
              if (!entry) return;
              n = entry.gap != null ? entry.gap : entry;
              if (n == null) return;
              block.gap = clampGap(n);
            });
          } else if (data.gap != null) {
            n = clampGap(data.gap);
            for (i = 0; i < BLOCKS.length; i++) BLOCKS[i].gap = n;
          }
          if (data.pairGaps && data.pairGaps.length) {
            byName = savedByBlockName(
              data.pairGaps[0] && data.pairGaps[0].name
                ? data.pairGaps
                : data.pairGaps.map(function (gap, idx) {
                    return { name: OLD_BLOCK_ORDER[idx], pairGap: gap };
                  })
            );
            BLOCKS.forEach(function (block) {
              if (!block.row) return;
              var entry = byName[block.name];
              if (!entry) return;
              n = entry.pairGap != null ? entry.pairGap : entry;
              if (n == null) return;
              block.pairGap = clampPairGap(n);
            });
          }
        }

        function serializeGaps() {
          return BLOCKS.map(function (block) {
            return { name: block.name, gap: clampGap(block.gap) };
          });
        }

        function serializePairGaps() {
          return BLOCKS.map(function (block) {
            return {
              name: block.name,
              pairGap: block.row ? clampPairGap(block.pairGap) : null,

        function serializePoses() {
          return BLOCKS.map(function (block) {

        function fmtAxis(axis, v) {
          var n = Number(v);
          if (!isFinite(n)) return "";
          if (axis.key === "fs" || axis.key === "lh") return Math.round(n) + "px";
          if (axis.key === "track") return n.toFixed(2);
          if (axis.key === "slnt") return n.toFixed(2).replace(/\.00$/, "");
          return String(Math.round(n));
        }

        function thumbPct(el) {
          var min = parseFloat(el.min);
          var max = parseFloat(el.max);
          var span = max - min || 1;
          return ((parseFloat(el.value) - min) / span) * 100;
        }

        function updateDualUI(axis) {
          var startEl = lineEls[axis.id + "0"];
          var endEl = lineEls[axis.id + "1"];
          if (!startEl || !endEl) return;
          var fill = document.getElementById(axis.id + "Fill");
          var startVal = document.getElementById(axis.id + "0Val");
          var endVal = document.getElementById(axis.id + "1Val");
          var a = parseFloat(startEl.value);
          var b = parseFloat(endEl.value);
          var min = parseFloat(startEl.min);
          var max = parseFloat(startEl.max);
          var span = max - min || 1;
          var lo = Math.min(a, b);
          var hi = Math.max(a, b);
          if (fill) {
            fill.style.left = ((lo - min) / span) * 100 + "%";
            fill.style.width = Math.max(0, ((hi - lo) / span) * 100) + "%";
          }
          if (startVal) {
            startVal.textContent = fmtAxis(axis, a);
            startVal.style.left = thumbPct(startEl) + "%";
          }
          if (endVal) {
            endVal.textContent = fmtAxis(axis, b);
            endVal.style.left = thumbPct(endEl) + "%";
          }
        }

        function updateAllDualUI() {
          LINE_AXES.forEach(updateDualUI);
        }

        function writeSlidersToLine() {
          var spec = activeSpec();
          if (!spec) return;
          LINE_AXES.forEach(function (axis) {
            var startEl = lineEls[axis.id + "0"];
            var endEl = lineEls[axis.id + "1"];

            var b = parseFloat(endEl.value);
            if (!isFinite(a) || !isFinite(b)) return;
            spec.from[axis.key] = a;
            spec.to[axis.key] = b;
          });
        }

        function writeLineToSliders() {

            endEl.value = spec.to[axis.key];
          });
          syncingPoses = false;
          updateAllDualUI();

            lineReadout.textContent = spec.text.toLowerCase() + " · pose 1 → 2";
          }
        }

        function onLineInput() {
          if (syncingPoses) return;
          writeSlidersToLine();
          updateAllDualUI();
          syncTrack(true);
          save();
        }

        function buildLineAxes() {
          if (!lineAxesEl) return;
          lineAxesEl.innerHTML = "";
          lineEls = {};
          LINE_AXES.forEach(function (axis) {
            var row = document.createElement("div");

            row.innerHTML =
              "<label for=\"" +

              axis.label +
              "</label>" +
              "<div class=\"dual-range\">" +
              "<span class=\"dual-val\" id=\"" +
              axis.id +
              "0Val\"></span>" +
              "<span class=\"dual-val\" id=\"" +
              axis.id +
              "1Val\"></span>" +
              "<div class=\"dual-track\"><div class=\"dual-fill\" id=\"" +

              "Fill\"></div></div>" +
              "<input id=\"" +

              "\" aria-label=\"" +

        function paintLineTabs() {
          if (!lineTabsEl) return;
          var lines = flatLines();
          lineTabsEl.innerHTML = "";
          lines.forEach(function (line, i) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "line-tab" + (i === activeLine ? " is-on" : "");
            btn.setAttribute("data-line", String(i));
            btn.setAttribute("role", "tab");
            btn.setAttribute("aria-selected", i === activeLine ? "true" : "false");
            var n = document.createElement("span");
            n.className = "line-tab-n";

            btn.appendChild(n);
            btn.addEventListener("click", function () {

          });
        }

        function setActiveLine(i) {
          var n = flatLines().length;
          if (n <= 0) return;
          if (i < 0) i = 0;
          if (i >= n) i = n - 1;
          activeLine = i;
          writeLineToSliders();
          paintLineTabs();
        }

        function mixPose(a, b, t) {
          var e = ease(t);
          return {
            fs: lerp(a.fs, b.fs, e),
            lh: lerp(a.lh, b.lh, e),
            track: lerp(a.track, b.track, e),
            wght: lerp(a.wght, b.wght, e),
            wdth: lerp(a.wdth, b.wdth, e),
            cntr: lerp(a.cntr, b.cntr, e),
            slnt: lerp(a.slnt, b.slnt, e),
            after: lerp(a.after || 0, b.after || 0, e),
          };
        }

        function vfString(p) {
          return (
            '"wght" ' +
            p.wght.toFixed(1) +
            ', "wdth" ' +
            p.wdth.toFixed(1) +
            ', "CNTR" ' +
            p.cntr.toFixed(1) +
            ', "slnt" ' +
            p.slnt.toFixed(2)
          );
        }

        function applyLine(el, spec, t, pairGap) {
          var p = mixPose(spec.from, spec.to, t);
          var s = scale();
          el.style.fontVariationSettings = vfString(p);
          el.style.fontWeight = String(Math.round(p.wght));
          el.style.fontSize = p.fs * s + "px";
          el.style.lineHeight = p.lh * s + "px";
          el.style.letterSpacing = p.track + "em";
          el.style.marginLeft = "0";
          var gapPx = spec.pair ? clampPairGap(pairGap) : 0;
          el.style.marginRight = "calc(" + gapPx + "px + " + -p.track + "em)";
          var slot = el.parentNode;
          if (slot && slot.classList && slot.classList.contains("line-slot")) {
            var row =
              slot.parentNode &&
              slot.parentNode.classList &&
              slot.parentNode.classList.contains("is-row");
            if (row) {
              slot.style.height = "";
            } else {
              slot.style.height = p.lh * s + "px";
            }
            slot.style.marginBottom = p.after * s + "px";
          }
        }

        function morphT(elapsed) {
          if (holdKf >= 0) return holdKf;
          var hold = Math.max(0, num("hold", 880));
          var snap = Math.max(40, num("snap", 520));
          var seg = hold + snap;
          var total = Math.max(1, 2 * seg);
          var t = ((elapsed % total) + total) % total;
          var i = t < seg ? 0 : 1;
          var local = t - i * seg;
          if (local < hold) return i;
          var u = (local - hold) / snap;
          return i + (1 - 2 * i) * ease(u);
        }

        function paintKfTabs() {
          kfTabs.forEach(function (tab, i) {
            if (!tab) return;
            var on = holdKf === i;
            tab.classList.toggle("is-on", on);
            tab.setAttribute("aria-selected", on ? "true" : "false");
          });
          if (kfSeq) {
            kfSeq.textContent =
              holdKf >= 0
                ? "holding pose " + (holdKf + 1) + " · click again to play"
                : "1 → 2 → 1 · click a pose to hold";
          }
        }

        function applyMorphs() {
          var i;
          var j;
          var t = morphT(lastElapsed);
          var node;
          for (i = 0; i < nodes.length; i++) {
            node = nodes[i];
            for (j = 0; j < node.lines.length; j++) {
              applyLine(
                node.lines[j],
                BLOCKS[node.index].lines[j],
                t,
                BLOCKS[node.index].pairGap
              );
            }
          }
          var first = track.firstElementChild;
          if (first) {
            var h = first.offsetHeight;
            if (h > 1) loopHeight = h;
          }
          if (nowReadout) {
            var prefix = holdKf >= 0 ? "hold " + (holdKf + 1) + " · " : "";
            nowReadout.textContent = prefix + "pose " + (t * 100).toFixed(0) + "%";
          }
          var live = holdKf >= 0 ? holdKf : t >= 0.5 ? 1 : 0;
          if (live !== lastLiveKf) {
            lastLiveKf = live;
            kfTabs.forEach(function (tab, i) {
              if (tab) tab.classList.toggle("is-live", i === live);
            });
          }
        }

        function makeCycle() {
          var cycle = document.createElement("div");
          cycle.className = "cycle";
          var i;
          var j;
          var block;
          var spec;
          var slot;
          var line;
          var node;
          for (i = 0; i < BLOCKS.length; i++) {
            spec = BLOCKS[i];
            block = document.createElement("div");
            block.className = "block" + (spec.row ? " is-row" : "");
            block.setAttribute("data-block", spec.name);
            node = { el: block, index: i, lines: [] };
            for (j = 0; j < spec.lines.length; j++) {
              slot = document.createElement("div");
              slot.className = "line-slot";
              line = document.createElement("span");
              line.className = "line";
              line.textContent = spec.lines[j].text;
              slot.appendChild(line);
              block.appendChild(slot);
              node.lines.push(line);
            }
            block.style.marginBottom = clampGap(spec.gap) + "px";
            cycle.appendChild(block);
            nodes.push(node);
          }
          return cycle;
        }

        function copyCount(h) {
          if (!(h > 24)) return 2;
          return Math.max(2, Math.ceil(STAGE_H / h) + 1);
        }

        function buildTrack() {
          track.innerHTML = "";
          nodes = [];
          var first = makeCycle();
          track.appendChild(first);
          loopHeight = Math.max(1, first.offsetHeight);
          var need = copyCount(loopHeight);
          var n;
          for (n = 1; n < need; n += 1) {
            track.appendChild(makeCycle());
          }
          applyMorphs();
          loopHeight = Math.max(1, first.offsetHeight);
          applyTransform();
        }

        function morphCycleMs() {
          var hold = Math.max(0, num("hold", 880));
          var snap = Math.max(40, num("snap", 520));
          return Math.max(1, 2 * (hold + snap));
        }

        function durationMs() {
          var belt = Math.max(1000, num("loop", 16) * 1000);
          var morph = morphCycleMs();
          if (belt % morph === 0) return belt;
          return Math.max(belt, morph);
        }

        function wrapY(y, h) {
          h = Math.max(1, h);
          y = y % h;
          if (y < 0) y += h;
          return y;
        }

        function pinCenter(el) {
          if (!el) return null;
          var r = el.getBoundingClientRect();
          return r.top + r.height / 2;
        }

        function pickPin() {
          if (!nodes.length) return null;
          var sr = stage.getBoundingClientRect();
          if (!(sr.height > 1)) return null;
          var pinY = sr.top + sr.height * 0.5;
          var best = null;
          var bestD = Infinity;
          var i;
          var r;
          var cy;
          var d;
          for (i = 0; i < nodes.length; i++) {
            r = nodes[i].el.getBoundingClientRect();
            if (!(r.height > 1)) continue;
            cy = r.top + r.height / 2;
            d = Math.abs(cy - pinY);
            if (d < bestD) {
              bestD = d;
              best = nodes[i].el;
            }
          }
          return best;
        }

        function applyTransform() {
          var h = Math.max(1, loopHeight);
          while (h > 1 && beltY >= h) beltY -= h;
          track.style.transform = "translate3d(0," + (-beltY).toFixed(2) + "px,0)";
        }

        function syncTrack(compensate) {
          var pinEl = compensate ? pickPin() : null;
          var before = pinCenter(pinEl);
          applyMorphs();
          if (compensate && pinEl && pinEl.isConnected && before != null) {
            var after = pinCenter(pinEl);
            var sr = stage.getBoundingClientRect();
            var scaleY = sr.height / STAGE_H;
            if (after != null && scaleY > 0.01) {
              beltY += (after - before) / scaleY;
            }
          }
          applyTransform();
        }

        function applyElapsed(ms, beltTime) {
          lastElapsed = ms;
          if (beltTime != null) beltMs = beltTime;
          syncTrack(true);
        }

        function frame(now) {
          if (!lastFrame) lastFrame = now;
          var dt = now - lastFrame;
          lastFrame = now;
          lastElapsed = now - t0;
          if (scrollOn()) {
            beltMs += dt;
            beltY += (dt / durationMs()) * loopHeight;
          }
          syncTrack(true);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function stopPlayback() {
          playing = false;
          lastFrame = 0;
          cancelAnimationFrame(raf);
          raf = 0;
        }

        function startPlayback() {
          playing = true;
          lastFrame = 0;
          t0 = performance.now() - lastElapsed;
          cancelAnimationFrame(raf);
          raf = requestAnimationFrame(frame);
        }

        function restart() {
          lastLiveKf = -1;
          lastFrame = 0;
          beltMs = 0;
          beltY = 0;
          t0 = performance.now();
          paintKfTabs();
          applyElapsed(0, 0);
          cancelAnimationFrame(raf);
          if (playing) raf = requestAnimationFrame(frame);
        }

        function setHold(i) {
          if (holdKf === i) {
            holdKf = -1;
          } else {
            holdKf = i;
          }
          lastLiveKf = -1;
          paintKfTabs();
          syncTrack(true);
        }

        function formatVal(key, v) {
          if (CHECK_KEYS[key]) return Number(v) ? "on" : "off";
          if (COLOR_KEYS[key]) return String(v).toLowerCase();
          if (key === "scale") return Math.round(Number(v)) + "%";
          if (key === "hold" || key === "snap") {
            var ms = Number(v);
            if (ms >= 1000) return (ms / 1000).toFixed(1) + "s";
            return Math.round(ms) + "ms";
          }
          if (key === "loop") {
            var n = Number(v);
            return (Math.round(n * 10) / 10).toFixed(n % 1 ? 1 : 0) + "s";
          }
          return String(v);
        }

        function controlValue(key) {
          if (!els[key]) return DEFAULTS[key];
          if (CHECK_KEYS[key]) return els[key].checked ? "1" : "0";
          return els[key].value;
        }

        function applyVars() {
          root.style.setProperty("--bg", els.bg.value);
          root.style.setProperty("--fg", els.fg.value);
        }

        function paintVals() {
          Object.keys(vals).forEach(function (key) {
            if (!vals[key] || !els[key]) return;
            vals[key].textContent = formatVal(key, controlValue(key));
          });
        }

        function save() {
          var data = {};
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            if (COLOR_KEYS[key]) data[key] = els[key].value;
            else if (CHECK_KEYS[key]) data[key] = els[key].checked ? "1" : "0";
            else data[key] = parseFloat(els[key].value);
          });
          data.poses = serializePoses();
          data.blockGaps = serializeGaps();
          data.pairGaps = serializePairGaps();
          try {
            localStorage.setItem(LS_KEY, JSON.stringify(data));
          } catch (e) {}
        }

        function loadSaved() {
          var raw = null;
          try {
            raw = localStorage.getItem(LS_KEY);
          } catch (e) {}
          if (!raw) return;
          var data;
          try {
            data = JSON.parse(raw);
          } catch (e) {
            return;
          }
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key] || data[key] == null) return;
            if (CHECK_KEYS[key]) {
              els[key].checked = data[key] === "1" || data[key] === true;
            } else {
              els[key].value = data[key];
            }
          });
          if (data.poses) applySavedPoses(data.poses);
          applySavedGaps(data);
        }

        function reset() {
          Object.keys(DEFAULTS).forEach(function (key) {
            if (!els[key]) return;
            if (CHECK_KEYS[key]) {
              els[key].checked = DEFAULTS[key] === "1";
            } else {
              els[key].value = DEFAULTS[key];
            }
          });
          BLOCKS = cloneBlocks(BLOCK_DEFS);
          activeLine = 0;
          holdKf = -1;
          try {
            localStorage.removeItem(LS_KEY);
          } catch (e) {}
          applyVars();
          paintVals();
          paintKfTabs();
          paintLineTabs();
          writeLineToSliders();
          writeGapsToSliders();
          buildTrack();
          restart();
          if (window.ArtboardView && window.ArtboardView.reset) {
            window.ArtboardView.reset();
          }
        }

        function onSettingInput() {
          applyVars();
          paintVals();
          if (this && this.id === "scale") {
            buildTrack();
          } else {
            syncTrack(true);
          }
          save();
        }

        Object.keys(els).forEach(function (key) {
          if (!els[key]) return;
          els[key].addEventListener("input", onSettingInput);
          els[key].addEventListener("change", onSettingInput);
        });

        kfTabs.forEach(function (tab, i) {
          if (!tab) return;
          tab.addEventListener("click", function () {
            setHold(i);
          });
        });

        loadSaved();
        try {
          var holdParam = new URLSearchParams(location.search).get("hold");
          if (holdParam === "1" || holdParam === "2") holdKf = Number(holdParam) - 1;
        } catch (e) {}
        buildLineAxes();
        buildBlockGaps();
        paintLineTabs();
        writeLineToSliders();
        applyVars();
        paintVals();
        paintKfTabs();
        buildTrack();
        restart();

        function afterFonts() {
          buildTrack();
        }

        if (document.fonts && document.fonts.load) {
          Promise.all([
            document.fonts.load('400 290px "IkarusPlusVariable"'),
            document.fonts.ready,
          ])
            .then(afterFonts)
            .catch(afterFonts);
        } else if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(afterFonts);
        } else {
          afterFonts();
        }

        window.AnimatorExport = {
          stage: stage,
          filename: "conveyor.mp4",
          durationMs: durationMs,
          seek: function (ms) {
            lastElapsed = ms;
            beltMs = ms;
            applyMorphs();
            var h = Math.max(1, loopHeight);
            beltY = wrapY((ms / durationMs()) * h, h);
            applyTransform();
          },
          stop: stopPlayback,
          start: startPlayback,
        };
      })();
    </script>
    <script type="module" src="../../web-export.js?v=9"></script>
  </body>
</html>
