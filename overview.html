<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>animator</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #d3d3d3;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        line-height: 1.25;
        color: #1f1f1f;
      }

      body {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      .assets-directory {
        flex: 0 0 220px;
        height: 100%;
        padding: 16px 14px;
        border-right: 1px solid rgba(31, 31, 31, 0.16);
        background: transparent;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow: auto;
      }

      .assets-directory h1 {
        margin: 0 0 6px;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        color: #1f1f1f;
      }

      .assets-section + .assets-section {
        margin-top: 4px;
      }

      .assets-section-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 4px;
        cursor: pointer;
      }

      .assets-title {
        margin: 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        color: #1f1f1f;
      }

      .assets-section-toggle {
        border: 0;
        background: transparent;
        color: #1f1f1f;
        padding: 0;
        cursor: pointer;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        line-height: 1;
        min-width: 12px;
        text-align: center;
      }

      .assets-section-toggle:hover,
      .assets-section-toggle:focus {
        text-decoration: none;
        outline: none;
      }

      .saved-billboards-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .saved-billboards-list[hidden] {
        display: none;
      }

      .saved-billboard-button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: transparent;
        color: #1f1f1f;
        padding: 1px 0 1px 10px;
        cursor: pointer;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        line-height: 1.25;
        text-decoration: none;
        text-transform: lowercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .saved-billboard-button:hover,
      .saved-billboard-button:focus {
        text-decoration: underline;
        outline: none;
      }

      .saved-billboard-button.is-active {
        text-decoration: underline;
        color: #000;
      }

      .saved-billboards-empty {
        padding: 1px 0 1px 10px;
        color: #555;
      }

      .sidebar-footer {
        margin-top: auto;
        color: #555;
        font-size: 12px;
        line-height: 1.5;
      }

      .sidebar-footer a {
        color: #1f1f1f;
        text-decoration: none;
        text-transform: lowercase;
      }

      .sidebar-footer a:hover,
      .sidebar-footer a:focus {
        text-decoration: underline;
        outline: none;
      }

      .viewer {
        flex: 1 1 auto;
        position: relative;
        background: #d3d3d3;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #555;
        text-transform: lowercase;
      }

      .viewer.has-frame {
        display: block;
      }

      .viewer iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
        background: transparent;
      }

      .viewer.has-frame iframe {
        display: block;
      }
    </style>
  </head>
  <body>
    <aside class="assets-directory" aria-label="Versions">
      <h1>animator</h1>

      <div class="assets-section">
        <div class="assets-section-title-row">
          <h2 class="assets-title">version 1</h2>
          <button
            id="v1Toggle"
            type="button"
            class="assets-section-toggle"
            aria-expanded="false"
            aria-controls="v1List"
            aria-label="expand version 1"
          >
            +
          </button>
        </div>
        <ul class="saved-billboards-list" id="v1List" hidden></ul>
      </div>

      <div class="assets-section">
        <div class="assets-section-title-row">
          <h2 class="assets-title">version 2</h2>
          <button
            id="v2Toggle"
            type="button"
            class="assets-section-toggle"
            aria-expanded="false"
            aria-controls="v2List"
            aria-label="expand version 2"
          >
            +
          </button>
        </div>
        <ul class="saved-billboards-list" id="v2List" hidden></ul>
      </div>

      <div class="sidebar-footer">
        <a href="index.html">open editor →</a>
      </div>
    </aside>

    <main class="viewer" id="viewer">
      <span id="viewerHint">choose an animation →</span>
      <iframe
        id="frame"
        title="Animation"
        src="about:blank"
        allow="autoplay; clipboard-write"
      ></iframe>
    </main>

    <script>
      (function () {
        var LAST_KEY = "animator:portal:last";
        var COLLAPSE_KEY = "animator:portal:collapsed";

        var VERSIONS = {
          v1: {
            key: "v1",
            label: "version 1",
            manifest: "animations/animations.json",
            list: document.getElementById("v1List"),
            toggle: document.getElementById("v1Toggle"),
            prefix: "",
            items: [],
          },
          v2: {
            key: "v2",
            label: "version 2",
            manifest: "version-2/animations/animations.json",
            list: document.getElementById("v2List"),
            toggle: document.getElementById("v2Toggle"),
            prefix: "version-2/",
            items: [],
          },
        };

        var frame = document.getElementById("frame");
        var viewer = document.getElementById("viewer");
        var viewerHint = document.getElementById("viewerHint");
        var collapsed = { v1: true, v2: true };

        function slugify(stem) {
          return (
            String(stem)
              .replace(/[^a-zA-Z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "")
              .toLowerCase() || "animation"
          );
        }

        function humanise(stem) {
          return String(stem).replace(/[-_]+/g, " ").trim();
        }

        function resolveUrl(version, url) {
          var u = String(url || "");
          if (!u) return u;
          if (/^[a-z]+:|^\/\//i.test(u) || u.charAt(0) === "/") return u;
          if (u.charAt(0) === ".") return u;
          if (version.prefix && u.indexOf(version.prefix) === 0) return u;
          return version.prefix + u.replace(/^\.\//, "");
        }

        function readCollapsed() {
          try {
            var raw = localStorage.getItem(COLLAPSE_KEY);
            if (!raw) return;
            var obj = JSON.parse(raw);
            if (obj && typeof obj === "object") {
              if (typeof obj.v1 === "boolean") collapsed.v1 = obj.v1;
              if (typeof obj.v2 === "boolean") collapsed.v2 = obj.v2;
            }
          } catch (e) {}
        }

        function writeCollapsed() {
          try {
            localStorage.setItem(COLLAPSE_KEY, JSON.stringify(collapsed));
          } catch (e) {}
        }

        function setCollapsed(key, isCollapsed) {
          var version = VERSIONS[key];
          if (!version) return;
          collapsed[key] = !!isCollapsed;
          version.list.hidden = collapsed[key];
          version.toggle.textContent = collapsed[key] ? "+" : "-";
          version.toggle.setAttribute("aria-expanded", String(!collapsed[key]));
          version.toggle.setAttribute(
            "aria-label",
            (collapsed[key] ? "expand " : "collapse ") + version.label
          );
          writeCollapsed();
        }

        function loadManifest(version) {
          return fetch(version.manifest, { cache: "no-store" })
            .then(function (r) {
              if (!r.ok) throw new Error("manifest " + r.status);
              return r.json();
            })
            .then(function (data) {
              var list = (data && data.animations) || [];
              version.items = list.map(function (a) {
                var label = a.label || humanise(a.id || "");
                return {
                  id: a.id || slugify(a.url || a.label || ""),
                  label: label,
                  url: resolveUrl(version, a.url),
                  mtime: a.mtime != null ? a.mtime : null,
                };
              });
            })
            .catch(function () {
              version.items = [];
            });
        }

        function iframeSrc(anim) {
          var u = anim && anim.url ? String(anim.url) : "";
          if (!u) return "about:blank";
          if (anim.mtime == null) return u;
          return u + (u.indexOf("?") >= 0 ? "&" : "?") + "v=" + anim.mtime;
        }

        function findAnim(versionKey, id) {
          var version = VERSIONS[versionKey];
          if (!version) return null;
          for (var i = 0; i < version.items.length; i++) {
            if (version.items[i].id === id) return version.items[i];
          }
          return null;
        }

        function parseHash() {
          var h = (window.location.hash || "").replace(/^#/, "").trim();
          var m = h.match(/^(v[12])\/(.+)$/);
          if (!m) return null;
          return { version: m[1], id: decodeURIComponent(m[2]) };
        }

        function renderList(version, activeId) {
          version.list.innerHTML = "";
          if (!version.items.length) {
            var empty = document.createElement("li");
            empty.className = "saved-billboards-empty";
            empty.textContent = "no animations found";
            version.list.appendChild(empty);
            return;
          }
          version.items.forEach(function (a) {
            var li = document.createElement("li");
            var link = document.createElement("a");
            link.href = "#" + version.key + "/" + encodeURIComponent(a.id);
            link.className = "saved-billboard-button";
            link.textContent = a.label;
            if (a.id === activeId) {
              link.classList.add("is-active");
              link.setAttribute("aria-current", "page");
            }
            li.appendChild(link);
            version.list.appendChild(li);
          });
        }

        function render(active) {
          renderList(VERSIONS.v1, active && active.version === "v1" ? active.id : null);
          renderList(VERSIONS.v2, active && active.version === "v2" ? active.id : null);
        }

        function showHint() {
          viewer.classList.remove("has-frame");
          if (viewerHint) viewerHint.hidden = false;
          frame.src = "about:blank";
          frame.removeAttribute("data-current");
          document.title = "animator";
        }

        function load(versionKey, id, opts) {
          var anim = findAnim(versionKey, id);
          var forceOpen = opts && opts.forceOpen;
          if (!anim) {
            render(null);
            showHint();
            return;
          }
          var src = iframeSrc(anim);
          if (frame.getAttribute("data-current") !== src) {
            frame.src = src;
            frame.setAttribute("data-current", src);
          }
          viewer.classList.add("has-frame");
          if (viewerHint) viewerHint.hidden = true;
          render({ version: versionKey, id: anim.id });
          document.title = "animator — " + anim.label;
          if (forceOpen) setCollapsed(versionKey, false);
          try {
            localStorage.setItem(
              LAST_KEY,
              JSON.stringify({ version: versionKey, id: anim.id })
            );
          } catch (e) {}
        }

        function readLast() {
          try {
            var raw = localStorage.getItem(LAST_KEY);
            if (!raw) return null;
            var obj = JSON.parse(raw);
            if (obj && (obj.version === "v1" || obj.version === "v2") && obj.id) {
              return obj;
            }
          } catch (e) {}
          return null;
        }

        function initial() {
          var fromHash = parseHash();
          if (fromHash && findAnim(fromHash.version, fromHash.id)) return fromHash;
          var saved = readLast();
          if (saved && findAnim(saved.version, saved.id)) return saved;
          return null;
        }

        function bindAccordion(key) {
          var version = VERSIONS[key];
          var row = version.toggle.closest(".assets-section-title-row");
          if (!row) return;
          row.addEventListener("click", function (e) {
            e.preventDefault();
            setCollapsed(key, !collapsed[key]);
          });
        }
        bindAccordion("v1");
        bindAccordion("v2");

        window.addEventListener("hashchange", function () {
          var parsed = parseHash();
          if (parsed && findAnim(parsed.version, parsed.id)) {
            load(parsed.version, parsed.id, { forceOpen: true });
          }
        });

        readCollapsed();
        Promise.all([loadManifest(VERSIONS.v1), loadManifest(VERSIONS.v2)]).then(
          function () {
            setCollapsed("v1", collapsed.v1);
            setCollapsed("v2", collapsed.v2);
            var start = initial();
            if (start) {
              if (!parseHash()) {
                history.replaceState(
                  null,
                  "",
                  "#" + start.version + "/" + encodeURIComponent(start.id)
                );
              }
              load(start.version, start.id, { forceOpen: true });
            } else {
              render(null);
              showHint();
            }
          }
        );
      })();
    </script>
  </body>
</html>
