<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>animator</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e0e0e;
        font-family: "Courier New", Courier, monospace;
        font-size: 12px;
        line-height: 1.4;
        color: #e9e9e9;
      }

      body {
        display: flex;
        height: 100vh;
        overflow: hidden;
      }

      .sidebar {
        flex: 0 0 200px;
        height: 100%;
        padding: 16px 14px;
        border-right: 1px solid #1f1f1f;
        background: #131313;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow: auto;
      }

      .sidebar h1 {
        margin: 0;
        font-size: 12px;
        font-weight: 400;
        text-transform: lowercase;
        letter-spacing: 0.06em;
        color: #9a9a9a;
      }

      .nav-section {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nav-title {
        margin: 0 0 4px 2px;
        text-transform: lowercase;
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #6a6a6a;
      }

      .nav-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .nav-list .nav-item {
        display: block;
        padding: 6px 8px;
        border-radius: 4px;
        color: #cfcfcf;
        text-decoration: none;
        text-transform: lowercase;
        border: 1px solid transparent;
      }

      .nav-list .nav-item:hover,
      .nav-list .nav-item:focus {
        background: #1d1d1d;
        color: #fff;
        outline: none;
      }

      .nav-list .nav-meta {
        display: block;
        color: #6a6a6a;
        font-size: 10px;
        margin-top: 1px;
      }

      .viewer {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6a6a6a;
        text-transform: lowercase;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar" aria-label="Versions">
      <h1>animator</h1>

      <div class="nav-section">
        <p class="nav-title">versions</p>
        <ul class="nav-list">
          <li>
            <a class="nav-item" href="version-1/overview.html">
              version 1
              <span class="nav-meta">square artboards</span>
            </a>
          </li>
          <li>
            <a class="nav-item" href="version-2/overview.html">
              version 2
              <span class="nav-meta">1080 × 1440</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <main class="viewer">choose a version →</main>
  </body>
</html>
